    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.2);
            --shadow-xl: 0 12px 32px rgba(0, 0, 0, 0.25);

            --ball-size: 300px;
            /* Keep these in sync with the timing constants in the script. */
            --shake-time: 500ms;
            --flip-half: 200ms;  /* the flip is two halves: old face rolls off, new face rolls on */
            --fade-time: 400ms;  /* reduced-motion cross-fade, same total as the flip */
            --rise-time: 600ms;
            --sink-time: 150ms;  /* old answer fades out before the ball flips back */
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        h1 {
            color: white;
            font-size: 2.5em;
            font-weight: 700;
            margin: 0 0 10px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .instruction {
            color: rgba(255,255,255,0.9);
            font-size: 1.1em;
            font-weight: 400;
            margin: 0 0 40px;
            text-align: center;
        }

        .input-container {
            margin-bottom: 32px;
            text-align: center;
        }

        #question {
            width: 400px;
            max-width: 90vw;
            padding: 16px 20px;
            font-size: 1.05em;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            margin-bottom: 20px;
            transition: box-shadow 0.2s ease;
        }

        #question:focus {
            outline: none;
            box-shadow: var(--shadow-lg), 0 0 0 3px rgba(255,255,255,0.6);
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            font-size: 1.05em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
        }

        #displayQuestion {
            color: white;
            font-size: 1.4em;
            font-weight: 500;
            font-style: italic;
            margin: 0 0 32px;
            max-width: 600px;
            overflow-wrap: anywhere;
            text-align: center;
            min-height: 1.4em;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #displayQuestion.visible {
            opacity: 1;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ---------- The ball ----------
           1em inside .ball = 1% of the ball's diameter, so every part scales
           with --ball-size (the screenshot card just sets a smaller one). */

        .ball-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .ball-button {
            display: block;
            position: relative;
            z-index: 1;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 50%;
            background: none;
            font: inherit;
            color: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .ball-button:focus {
            outline: none;
        }

        .ball-button:focus-visible {
            outline: 3px solid rgba(255,255,255,0.9);
            outline-offset: 6px;
        }

        .ball {
            --sx: 4em;
            --sy: 1em;
            --sr: 9deg;
            display: block;
            position: relative;
            width: var(--ball-size);
            height: var(--ball-size);
            font-size: calc(var(--ball-size) / 100);
            border-radius: 50%;
            overflow: hidden;
            isolation: isolate;
            background: radial-gradient(circle at 34% 30%, #44444c 0%, #1d1d22 24%, #0a0a0c 52%, #000 78%);
        }

        .ball.shaking {
            animation: shake var(--shake-time) ease-in-out;
        }

        /* --sx/--sy/--sr are re-rolled by the script before each shake. */
        @keyframes shake {
            0%, 100% { transform: none; }
            12% { transform: translate(calc(var(--sx) * -1), var(--sy)) rotate(calc(var(--sr) * -1)); }
            27% { transform: translate(var(--sx), calc(var(--sy) * -1)) rotate(var(--sr)); }
            42% { transform: translate(calc(var(--sx) * -0.8), var(--sy)) rotate(calc(var(--sr) * -0.8)); }
            57% { transform: translate(calc(var(--sx) * 0.6), 0) rotate(calc(var(--sr) * 0.6)); }
            72% { transform: translate(calc(var(--sx) * -0.4), 0) rotate(calc(var(--sr) * -0.4)); }
            87% { transform: translate(calc(var(--sx) * 0.15), 0) rotate(calc(var(--sr) * 0.15)); }
        }

        /* Faces printed on the sphere. Centred with margins so transform is
           free for the roll animation. */
        .decal {
            display: block;
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
        }

        .decal-eight {
            width: 45em;
            height: 45em;
            margin: -22.5em 0 0 -22.5em;
        }

        .decal-window {
            width: 64em;
            height: 64em;
            margin: -32em 0 0 -32em;
        }

        /* Turning the ball over: the old face slides down over the bottom of
           the sphere (foreshortening as it goes) and the new face comes over
           the top. Keyframes sample sin/cos at 0, 30, 60 and 90 degrees. */
        @keyframes roll-out {
            0%   { transform: translateY(0) scaleY(1); }
            33%  { transform: translateY(25em) scaleY(0.866); }
            66%  { transform: translateY(43.3em) scaleY(0.5); }
            100% { transform: translateY(50em) scaleY(0); }
        }

        @keyframes roll-in {
            0%   { transform: translateY(-50em) scaleY(0); }
            33%  { transform: translateY(-43.3em) scaleY(0.5); }
            66%  { transform: translateY(-25em) scaleY(0.866); }
            100% { transform: translateY(0) scaleY(1); }
        }

        @keyframes fade-out {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .ball[data-face="eight"] .decal-window,
        .ball[data-face="window"] .decal-eight {
            visibility: hidden;
        }

        .ball[data-face="to-window"] .decal-eight,
        .ball[data-face="to-eight"] .decal-window {
            animation: roll-out var(--flip-half) linear forwards;
        }

        .ball[data-face="to-window"] .decal-window,
        .ball[data-face="to-eight"] .decal-eight {
            animation: roll-in var(--flip-half) linear var(--flip-half) both;
        }

        /* Idle side: white circle with a black 8. */
        .eight-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 42% 38%, #ffffff 0%, #f3f3f3 55%, #d6d6d6 100%);
            box-shadow:
                inset -1.2em -1.6em 3em rgba(0,0,0,0.3),
                inset 0.6em 0.8em 1.6em rgba(255,255,255,0.9);
        }

        .eight {
            display: block;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 700;
            font-size: 33em;
            line-height: 1;
            color: #0d0d0d;
        }

        /* Answer side: black rim and blue liquid with the answer floating in it. */
        .window {
            display: block;
            width: 100%;
            height: 100%;
            padding: 1.6em;
            border-radius: 50%;
            background: #040405;
            box-shadow: 0 0 0 0.5em rgba(255,255,255,0.05);
        }

        .liquid {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            /* Inner shadow is baked into the gradients: html2canvas paints
               blurred inset box-shadows as solid black. */
            background:
                linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.3) 12%, rgba(0,0,0,0) 28%),
                radial-gradient(circle at 50% 45%, #1d3cab 0%, #11277e 30%, #08144c 58%, #020822 80%, #000208 100%);
        }

        /* The answer floats in the liquid, centred in the window. The box is
           a rectangle that fits comfortably inside the window's circle. */
        .answer-float {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: absolute;
            left: 50%;
            top: 50%;
            width: 42em;
            height: 34em;
            margin: -17em 0 0 -21em;
            opacity: 0;
        }

        .answer-float.risen {
            opacity: 1;
            animation: rise var(--rise-time) cubic-bezier(0.2, 0.7, 0.3, 1) both;
        }

        /* Asking again: the old answer sinks back into the dark first. */
        .answer-float.risen.sinking {
            animation: fade-out var(--sink-time) ease forwards;
        }

        @keyframes rise {
            0%   { opacity: 0; transform: translateY(8em) scale(0.4); filter: blur(1.4em) brightness(0.4); }
            55%  { opacity: 0.85; filter: blur(0.4em) brightness(0.8); }
            100% { opacity: 1; transform: none; filter: none; }
        }

        .answer {
            display: block;
            font-family: 'Nunito', 'Arial Rounded MT Bold', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 800;
            font-size: 10em; /* overwritten by fitAnswer() */
            line-height: 1.1;
            text-align: center;
            overflow-wrap: normal; /* fitAnswer() switches to anywhere if it must */
            color: #dce8ff;
            text-shadow:
                0 0 0.25em rgba(110,160,255,0.85),
                0 0 0.7em rgba(70,120,255,0.55);
        }

        /* Lighting sits above both faces so it never moves with them. */
        .shade,
        .spec {
            display: block;
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }

        .shade {
            inset: 0;
            background: radial-gradient(circle at 36% 32%, rgba(0,0,0,0) 48%, rgba(0,0,0,0.35) 72%, rgba(0,0,0,0.8) 100%);
        }

        /* Highlights are square circles squashed with scaleY, rather than
           elliptical gradients, because html2canvas draws every radial
           gradient as a circle. */
        .spec-glow {
            left: 12em;
            top: 3em;
            width: 44em;
            height: 44em;
            transform: scaleY(0.77);
            background: radial-gradient(circle closest-side, rgba(255,255,255,0.16), rgba(255,255,255,0));
        }

        .spec-main {
            left: 19em;
            top: 7.5em;
            width: 20em;
            height: 20em;
            transform: rotate(-28deg) scaleY(0.55);
            background: radial-gradient(circle closest-side, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.7) 35%, rgba(255,255,255,0) 100%);
        }

        .spec-low {
            left: 58em;
            top: 72em;
            width: 26em;
            height: 26em;
            transform: rotate(-38deg) scaleY(0.385);
            background: radial-gradient(circle closest-side, rgba(255,255,255,0.12), rgba(255,255,255,0));
        }

        .floor-shadow {
            display: block;
            position: relative;
            width: calc(var(--ball-size) * 0.72);
            height: calc(var(--ball-size) * 0.11);
            margin-top: calc(var(--ball-size) * -0.045);
        }

        .floor-shadow::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: calc(var(--ball-size) * 0.72);
            margin-top: calc(var(--ball-size) * -0.36);
            transform: scaleY(0.153);
            border-radius: 50%;
            background: radial-gradient(circle closest-side, rgba(20,8,40,0.55), rgba(20,8,40,0.25) 55%, rgba(20,8,40,0));
        }

        /* ---------- Shake-to-ask toggle (phones only) ---------- */

        .shake-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 6px 14px 6px 8px;
            border: 0;
            border-radius: 999px;
            background: rgba(255,255,255,0.16);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .shake-toggle:focus {
            outline: none;
        }

        .shake-toggle:focus-visible {
            outline: 2px solid rgba(255,255,255,0.9);
            outline-offset: 2px;
        }

        .shake-toggle .switch {
            position: relative;
            width: 30px;
            height: 18px;
            border-radius: 9px;
            background: rgba(255,255,255,0.35);
            transition: background 0.2s ease;
        }

        .shake-toggle .switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: white;
            transition: transform 0.2s ease;
        }

        .shake-toggle[aria-pressed="true"] .switch {
            background: #4ade80;
        }

        .shake-toggle[aria-pressed="true"] .switch::after {
            transform: translateX(12px);
        }

        /* ---------- Quote panel ---------- */

        .quote-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 90%;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .quote-panel.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .quote-text {
            font-size: 1.15em;
            font-style: italic;
            color: #4c1d95;
            line-height: 1.7;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* On the page the quote is a button: tap it for another one. */
        button.quote-text {
            display: block;
            width: 100%;
            margin: 0;
            padding: 4px 8px;
            border: 0;
            border-radius: 10px;
            background: none;
            font-family: inherit;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button.quote-text:hover {
            background: rgba(109, 40, 217, 0.06);
        }

        button.quote-text:focus {
            outline: none;
        }

        button.quote-text:focus-visible {
            outline: 2px solid #6d28d9;
            outline-offset: 2px;
        }

        button.quote-text:disabled {
            cursor: default;
            background: none;
        }

        .quote-text.swapped {
            animation: quote-swap 250ms ease;
        }

        @keyframes quote-swap {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: none; }
        }

        .quote-label {
            font-size: 0.95em;
            color: #6d28d9;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
        }

        .quote-hint {
            margin-top: 10px;
            font-size: 0.8em;
            color: #8b5cf6;
            text-align: center;
        }

        /* ---------- Screenshot card ----------
           Built from the same ball markup and classes as the page. */

        .screenshot-card {
            --ball-size: 220px;
            position: fixed;
            left: -9999px;
            top: 0;
            width: 440px;
            padding: 32px 32px 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .screenshot-card *,
        .screenshot-card *::before,
        .screenshot-card *::after {
            animation: none !important;
            transition: none !important;
        }

        .card-title {
            color: white;
            margin: 0 0 16px;
            font-size: 1.6em;
            font-weight: 700;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .card-question {
            color: white;
            margin: 0 0 24px;
            font-size: 1.15em;
            font-weight: 500;
            font-style: italic;
            text-align: center;
            overflow-wrap: anywhere;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .card-ball {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-ball .ball {
            position: relative;
            z-index: 1;
        }

        .screenshot-card .quote-panel {
            width: 100%;
            padding: 22px;
            backdrop-filter: none;
        }

        .screenshot-card .quote-text {
            font-size: 1.05em;
            line-height: 1.6;
        }

        .card-watermark {
            margin: 16px 0 0;
            color: rgba(255,255,255,0.8);
            font-size: 0.85em;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-align: center;
        }

        /* ---------- Preview modal ---------- */

        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .preview-modal.visible {
            display: flex;
        }

        .preview-content {
            background: white;
            padding: 24px;
            border-radius: 16px;
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
            position: relative;
            box-shadow: var(--shadow-xl);
        }

        #previewImage canvas {
            display: block;
            max-width: 100% !important;
            height: auto !important;
            margin: 0 auto;
        }

        .preview-buttons {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .preview-buttons button {
            padding: 12px 28px;
            font-size: 1.05em;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all 0.2s ease;
            color: white;
        }

        .preview-buttons button:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .preview-buttons .btn-share {
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
        }

        .preview-buttons .btn-copy {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .preview-buttons .btn-copy.copied {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .preview-buttons .btn-download {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
        }

        .preview-buttons .btn-close {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
        }

        @media (max-width: 600px) {
            :root {
                --ball-size: 250px;
            }

            body {
                padding: 24px 16px;
            }

            h1 {
                font-size: 2em;
            }

            .instruction {
                margin-bottom: 20px;
            }

            .input-container {
                margin-bottom: 20px;
            }

            #question {
                margin-bottom: 12px;
            }

            #displayQuestion {
                font-size: 1.2em;
                margin-bottom: 16px;
            }

            .ball-area {
                margin-bottom: 24px;
            }

            .quote-panel {
                width: 100%;
                padding: 22px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ball.shaking {
                animation: none;
            }

            .ball[data-face="to-window"] .decal-eight,
            .ball[data-face="to-eight"] .decal-window {
                animation: fade-out var(--fade-time) ease forwards;
            }

            .ball[data-face="to-window"] .decal-window,
            .ball[data-face="to-eight"] .decal-eight {
                animation: fade-in var(--fade-time) ease both;
            }

            .answer-float.risen,
            .quote-panel.visible,
            .quote-text.swapped {
                animation: none;
            }

            .btn,
            .btn:hover,
            .preview-buttons button:hover {
                transition: none;
                transform: none;
            }

            .shake-toggle .switch,
            .shake-toggle .switch::after {
                transition: none;
            }
        }
    </style>

    <script type="module">
        // ================= Settings =================

        // Keep in sync with the CSS custom properties in :root.
        const SHAKE_TIME = 500;
        const FLIP_TIME = 400;   // 2 x --flip-half, and --fade-time for reduced motion
        const RISE_TIME = 600;
        const SINK_TIME = 150;
        const ANSWER_MAX_EM = 10;   // answer font size, in % of the ball's diameter
        const ANSWER_MIN_EM = 3;

        const HTML2CANVAS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

        const SHAKE_THRESHOLD = 15;
        const SHAKE_SAMPLE_MS = 100;
        const SHAKE_WINDOW_MS = 600;
        const SHAKE_COOLDOWN_MS = 1500;
        const MOTION_CHECK_MS = 2000;   // no readings by then means no sensor

        // ================= Data =================

        const answers = [

            "That's gonna be a no from me dawg",

            "I'm afraid I can't let you do that",

            "Have you considered: no?",
            "This ain't it",
            "Nah fam",
            "Not even if you paid me",
            "Zero chance, zilch, nada",
            "What part of no don't you understand",
            "Not in this timeline",

            "Absolutely not in any conceivable universe",
            "Shut it down",
            "Over my dead body",
            "Yeah that's a no for me",
            "The vibes are off (no)"
        ];

        // ================= State and logic (no DOM) =================

        const state = {
            question: '',        // the question currently on screen, unquoted
            busy: false,         // a shake sequence is running
            lastAnswer: -1,      // index of the answer shown last, to avoid repeats
            lastQuote: -1,
            quotes: [],          // display-ready quote strings
            shakeToAsk: false,
            screenshotBusy: false,
            canvas: null,        // the current screenshot, while the preview is open
            blob: null
        };

        // Random index in [0, length), never equal to `avoid` when there's a choice.
        function pickIndex(length, avoid) {
            if (length <= 1) {
                return 0;
            }
            if (avoid < 0 || avoid >= length) {
                return Math.floor(Math.random() * length);
            }
            const i = Math.floor(Math.random() * (length - 1));
            return i >= avoid ? i + 1 : i;
        }

        function nextAnswer() {
            state.lastAnswer = pickIndex(answers.length, state.lastAnswer);
            return answers[state.lastAnswer];
        }

        function nextQuote() {
            state.lastQuote = pickIndex(state.quotes.length, state.lastQuote);
            return state.quotes[state.lastQuote];
        }

        // Show the text between the first and last double quote, or the whole
        // line if it has no quoted section.
        function extractQuote(line) {
            const firstQuote = line.indexOf('"');
            const lastQuote = line.lastIndexOf('"');
            if (firstQuote !== -1 && lastQuote !== -1 && firstQuote !== lastQuote) {
                return line.substring(firstQuote + 1, lastQuote);
            }
            return line.trim();
        }

        function parseQuotes(text) {
            return text.split(/\r?\n/)
                .filter(line => line.trim() !== '')
                .map(extractQuote);
        }

        function formatQuestion(question) {
            return '"' + question + '"';
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function loadQuotes() {
            try {
                const response = await fetch('thebookofcarp.txt');
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                const quotes = parseQuotes(await response.text());
                if (quotes.length === 0) {
                    throw new Error('The quotes file is empty');
                }
                state.quotes = quotes;
            } catch (error) {
                console.warn('Error loading quotes:', error);
                state.quotes = [QUOTES_FALLBACK];
            }
        }

        // ================= DOM =================

        const els = {
            question: document.getElementById('question'),
            askBtn: document.getElementById('askBtn'),
            screenshotBtn: document.getElementById('screenshotBtn'),
            displayQuestion: document.getElementById('displayQuestion'),
            ballButton: document.getElementById('ballButton'),
            ball: document.getElementById('ball'),
            answerFloat: document.getElementById('answerFloat'),
            answer: document.getElementById('answer'),
            answerLive: document.getElementById('answerLive'),
            shakeToggle: document.getElementById('shakeToggle'),
            quotePanel: document.getElementById('quotePanel'),
            quoteText: document.getElementById('quoteText'),
            quoteHint: document.getElementById('quoteHint'),
            previewModal: document.getElementById('previewModal'),
            previewImage: document.getElementById('previewImage'),
            shareBtn: document.getElementById('shareBtn'),
            copyBtn: document.getElementById('copyBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            closeBtn: document.getElementById('closeBtn')
        };

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        const quotesReady = loadQuotes().then(() => {
            // Tapping for another quote only makes sense with more than one.
            const canCycle = state.quotes.length > 1;
            els.quoteText.disabled = !canCycle;
            els.quoteHint.hidden = !canCycle;
        });

        // Wait for the answer font before measuring text, so the fit is right.
        const fontsReady = document.fonts
            ? document.fonts.load('800 20px Nunito').catch(() => {})
            : Promise.resolve();

        // Shrink the answer until it fits its box in the window. Words only
        // break mid-word if they can't fit whole even at the minimum size.
        function fitAnswer() {
            const answer = els.answer;
            const box = answer.parentElement;
            const overflows = () => answer.offsetHeight > box.clientHeight || answer.scrollWidth > box.clientWidth;
            for (const wrap of ['normal', 'anywhere']) {
                answer.style.overflowWrap = wrap;
                let size = ANSWER_MAX_EM;
                answer.style.fontSize = size + 'em';
                while (size > ANSWER_MIN_EM && overflows()) {
                    size = Math.max(ANSWER_MIN_EM, size - 0.25);
                    answer.style.fontSize = size + 'em';
                }
                if (!overflows()) {
                    return;
                }
            }
        }

        // Re-fit if the answer font arrives after the first measurement.
        if (document.fonts) {
            document.fonts.addEventListener('loadingdone', () => {
                if (els.answer.textContent) fitAnswer();
            });
        }

        function setBusy(busy) {
            state.busy = busy;
            if (busy) {
                els.ballButton.setAttribute('aria-busy', 'true');
            } else {
                els.ballButton.removeAttribute('aria-busy');
            }
        }

        function renderQuestion(question) {
            els.displayQuestion.textContent = formatQuestion(question);
            els.displayQuestion.classList.add('visible');
        }

        // Put the answer in the (hidden) window and size it, ready to rise.
        function renderAnswer(text) {
            els.answerFloat.classList.remove('risen', 'sinking');
            els.answer.textContent = text;
            fitAnswer();
        }

        function revealAnswer(text) {
            void els.answerFloat.offsetWidth; // restart the rise animation
            els.answerFloat.classList.add('risen');
            els.answerLive.textContent = text;
        }

        function renderQuote(text, animate) {
            els.quoteText.textContent = text;
            if (animate) {
                els.quoteText.classList.remove('swapped');
                void els.quoteText.offsetWidth;
                els.quoteText.classList.add('swapped');
            }
        }

        function showQuotePanel() {
            els.quotePanel.classList.add('visible');
            els.screenshotBtn.hidden = false;
        }

        function hideQuotePanel() {
            els.quotePanel.classList.remove('visible');
        }

        async function flipTo(face) {
            els.ball.dataset.face = face === 'window' ? 'to-window' : 'to-eight';
            await wait(FLIP_TIME);
            els.ball.dataset.face = face;
        }

        function randomizeShake() {
            const sign = Math.random() < 0.5 ? -1 : 1;
            els.ball.style.setProperty('--sx', (sign * (3 + Math.random() * 2)).toFixed(2) + 'em');
            els.ball.style.setProperty('--sy', (0.5 + Math.random()).toFixed(2) + 'em');
            els.ball.style.setProperty('--sr', (sign * (6 + Math.random() * 6)).toFixed(1) + 'deg');
        }

        // A short buzz during the shake. Android only; other browsers ignore it.
        function buzz() {
            if (navigator.vibrate) {
                try {
                    navigator.vibrate([30, 50, 30, 50, 30]);
                } catch (error) {
                    // Not allowed right now; the shake works without it.
                }
            }
        }

        // ================= Actions =================

        async function shakeBall() {
            // Ignore clicks mid-shake, and before a question has been asked.
            if (state.busy || !state.question) {
                return;
            }
            setBusy(true);
            hideQuotePanel();
            els.answerLive.textContent = '';

            try {
                if (els.ball.dataset.face !== 'eight') {
                    els.answerFloat.classList.add('sinking');
                    await wait(SINK_TIME);
                    await flipTo('eight');
                }

                if (!reducedMotion.matches) {
                    randomizeShake();
                    buzz();
                    els.ball.classList.add('shaking');
                    await wait(SHAKE_TIME);
                    els.ball.classList.remove('shaking');
                }

                const answer = nextAnswer();
                await fontsReady;
                renderAnswer(answer);

                await flipTo('window');
                revealAnswer(answer);

                await quotesReady;
                renderQuote(nextQuote(), false);
                showQuotePanel();

                if (!reducedMotion.matches) {
                    await wait(RISE_TIME);
                }
            } finally {
                setBusy(false);
                preloadHtml2Canvas();
            }
        }

        function askQuestion() {
            const question = els.question.value.trim();

            // Only shake if there's a question, and not mid-shake
            if (!question || state.busy) {
                return;
            }

            state.question = question;
            renderQuestion(question);
            els.question.value = ''; // Clear the question box
            shakeBall();
        }

        function anotherQuote() {
            if (state.busy || state.quotes.length < 2) {
                return;
            }
            renderQuote(nextQuote(), !reducedMotion.matches);
        }

        // ================= Shake to ask =================

        const motion = {
            supported: 'DeviceMotionEvent' in window && window.matchMedia('(pointer: coarse)').matches,
            last: null,         // last sampled reading
            lastSampleAt: 0,
            lastJoltAt: 0,
            lastShakeAt: 0,
            gotReading: false
        };

        function onMotion(event) {
            const a = event.accelerationIncludingGravity;
            if (!a || a.x === null || a.y === null || a.z === null) {
                return;
            }
            motion.gotReading = true;
            const now = Date.now();
            if (now - motion.lastSampleAt < SHAKE_SAMPLE_MS) {
                return;
            }
            motion.lastSampleAt = now;
            if (motion.last) {
                const change = Math.abs(a.x - motion.last.x) + Math.abs(a.y - motion.last.y) + Math.abs(a.z - motion.last.z);
                if (change > SHAKE_THRESHOLD) {
                    const isShake = now - motion.lastJoltAt < SHAKE_WINDOW_MS;
                    motion.lastJoltAt = now;
                    if (isShake && now - motion.lastShakeAt > SHAKE_COOLDOWN_MS) {
                        motion.lastShakeAt = now;
                        onShakeGesture();
                    }
                }
            }
            motion.last = { x: a.x, y: a.y, z: a.z };
        }

        // A typed question gets asked; otherwise re-shake the current one.
        function onShakeGesture() {
            if (state.busy || els.previewModal.classList.contains('visible')) {
                return;
            }
            if (els.question.value.trim()) {
                askQuestion();
            } else {
                shakeBall();
            }
        }

        function setShakeToAsk(on) {
            state.shakeToAsk = on;
            els.shakeToggle.setAttribute('aria-pressed', String(on));
            els.question.placeholder = on ? PLACEHOLDER_SHAKE : PLACEHOLDER;
            if (on) {
                motion.last = null;
                window.addEventListener('devicemotion', onMotion);
            } else {
                window.removeEventListener('devicemotion', onMotion);
            }
        }

        async function toggleShakeToAsk() {
            if (state.shakeToAsk) {
                setShakeToAsk(false);
                return;
            }
            // iOS asks for permission, and only from a tap like this one.
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    if (await DeviceMotionEvent.requestPermission() !== 'granted') {
                        alert('Motion access is off, so shaking won\'t work. The buttons still do.');
                        return;
                    }
                } catch (error) {
                    console.warn('Motion permission failed:', error);
                    return;
                }
            }
            setShakeToAsk(true);

            // Some devices claim support but never send readings.
            setTimeout(() => {
                if (state.shakeToAsk && !motion.gotReading) {
                    setShakeToAsk(false);
                    els.shakeToggle.hidden = true;
                    alert('This device doesn\'t report motion, so shake to ask is off.');
                }
            }, MOTION_CHECK_MS);
        }

        // ================= Screenshot =================

        let html2canvasPromise = null;

        // Load html2canvas once; a failed load can be retried later.
        function loadHtml2Canvas() {
            if (window.html2canvas) {
                return Promise.resolve(window.html2canvas);
            }
            if (!html2canvasPromise) {
                html2canvasPromise = new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = HTML2CANVAS_URL;
                    script.onload = () => {
                        if (window.html2canvas) {
                            resolve(window.html2canvas);
                        } else {
                            reject(new Error('html2canvas did not load'));
                        }
                    };
                    script.onerror = () => {
                        script.remove();
                        reject(new Error('Could not load html2canvas'));
                    };
                    document.head.appendChild(script);
                }).catch(error => {
                    html2canvasPromise = null;
                    throw error;
                });
            }
            return html2canvasPromise;
        }

        // Fetch html2canvas quietly once the page is idle, so the first
        // screenshot is quick. A failure here is retried on the real click.
        function preloadHtml2Canvas() {
            if (window.html2canvas || html2canvasPromise) {
                return;
            }
            const load = () => loadHtml2Canvas().catch(() => {});
            if ('requestIdleCallback' in window) {
                requestIdleCallback(load, { timeout: 3000 });
            } else {
                setTimeout(load, 1000);
            }
        }

        // The card reuses the page's ball markup and classes, so the two
        // can't drift apart. Every string goes in through textContent.
        function buildScreenshotCard() {
            const card = document.createElement('div');
            card.className = 'screenshot-card';

            const title = document.createElement('h2');
            title.className = 'card-title';
            title.textContent = '🔮 Magic 8-Ball 🔮';

            const question = document.createElement('p');
            question.className = 'card-question';
            question.textContent = formatQuestion(state.question);

            const ballWrap = document.createElement('div');
            ballWrap.className = 'card-ball';
            const ball = els.ball.cloneNode(true);
            ball.dataset.face = 'window';
            ball.classList.remove('shaking');
            [ball, ...ball.querySelectorAll('[id]')].forEach(node => node.removeAttribute('id'));
            const floorShadow = document.createElement('span');
            floorShadow.className = 'floor-shadow';
            ballWrap.append(ball, floorShadow);

            const quotePanel = document.createElement('div');
            quotePanel.className = 'quote-panel visible';
            const label = document.createElement('div');
            label.className = 'quote-label';
            label.textContent = 'From The Book of Carp:';
            const quote = document.createElement('div');
            quote.className = 'quote-text';
            quote.textContent = els.quoteText.textContent;
            quotePanel.append(label, quote);

            const watermark = document.createElement('p');
            watermark.className = 'card-watermark';
            watermark.textContent = CARD_WATERMARK;

            card.append(title, question, ballWrap, quotePanel, watermark);
            return card;
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error('Could not create the image'));
                    }
                }, 'image/png');
            });
        }

        function screenshotFile(blob) {
            return new File([blob], DOWNLOAD_NAME, { type: 'image/png' });
        }

        function canShareImage(blob) {
            try {
                return Boolean(navigator.share && navigator.canShare && navigator.canShare({ files: [screenshotFile(blob)] }));
            } catch (error) {
                return false;
            }
        }

        async function takeScreenshot() {
            if (state.busy || state.screenshotBusy) {
                return;
            }
            if (!state.question) {
                alert('Please ask a question first!');
                return;
            }

            state.screenshotBusy = true;
            const card = buildScreenshotCard();
            document.body.appendChild(card);

            try {
                const html2canvas = await loadHtml2Canvas();
                if (document.fonts) {
                    await document.fonts.ready;
                }
                const canvas = await html2canvas(card, {
                    backgroundColor: null,
                    scale: 2,
                    logging: false
                });
                // Make the PNG now, so Share, Copy and Download can use it
                // straight from the tap (Safari requires that).
                state.blob = await canvasToBlob(canvas);
                state.canvas = canvas;
                els.previewImage.replaceChildren(canvas);
                els.shareBtn.hidden = !canShareImage(state.blob);
                els.previewModal.classList.add('visible');
            } catch (error) {
                console.error('Screenshot failed:', error);
                alert("Couldn't make the screenshot. Check your connection and try again.");
            } finally {
                card.remove();
                state.screenshotBusy = false;
            }
        }

        async function shareScreenshot() {
            if (!state.blob) {
                return;
            }
            try {
                await navigator.share({
                    files: [screenshotFile(state.blob)],
                    title: 'Magic 8-Ball'
                });
            } catch (error) {
                if (error.name === 'AbortError') {
                    return; // closed the share sheet
                }
                console.error('Share failed:', error);
                alert('Sharing failed. Try copying or downloading instead.');
            }
        }

        function downloadScreenshot() {
            if (!state.blob) {
                return;
            }
            const url = URL.createObjectURL(state.blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = DOWNLOAD_NAME;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            closePreview();
        }

        async function copyToClipboard(btn) {
            if (!state.blob) {
                return;
            }
            try {
                if (!navigator.clipboard || !navigator.clipboard.write || typeof ClipboardItem === 'undefined') {
                    throw new Error('Copying images is not supported in this browser');
                }
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': state.blob })
                ]);
                showCopied(btn);
            } catch (error) {
                console.error('Copy failed:', error);
                alert('Failed to copy to clipboard. Please try downloading instead.');
            }
        }

        function showCopied(btn) {
            if (!btn.dataset.label) {
                btn.dataset.label = btn.textContent.trim();
            }
            clearTimeout(btn.copiedTimer);
            btn.textContent = '✅ Copied!';
            btn.classList.add('copied');
            btn.copiedTimer = setTimeout(() => {
                btn.textContent = btn.dataset.label;
                btn.classList.remove('copied');
            }, 2000);
        }

        function closePreview() {
            els.previewModal.classList.remove('visible');
            state.canvas = null;
            state.blob = null;
        }

        // ================= Wiring =================

        els.askBtn.addEventListener('click', askQuestion);
        els.question.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.isComposing) {
                event.preventDefault();
                askQuestion();
            }
        });
        els.ballButton.addEventListener('click', shakeBall);
        els.quoteText.addEventListener('click', anotherQuote);
        els.screenshotBtn.addEventListener('click', takeScreenshot);

        els.previewModal.addEventListener('click', event => {
            // Only the backdrop closes it, not clicks inside the preview.
            if (event.target === els.previewModal) {
                closePreview();
            }
        });
        els.shareBtn.addEventListener('click', shareScreenshot);
        els.copyBtn.addEventListener('click', () => copyToClipboard(els.copyBtn));
        els.downloadBtn.addEventListener('click', downloadScreenshot);
        els.closeBtn.addEventListener('click', closePreview);

        if (motion.supported) {
            els.shakeToggle.hidden = false;
            els.shakeToggle.addEventListener('click', toggleShakeToAsk);
        }
    </script>
</body>
</html>
