<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shrek Dice</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://shrek-dice-default-rtdb.firebaseio.com" crossorigin />
  <link rel="preload" href="dice-shrek.webp" as="image" />
  <style>
    :root {
      --lime: #7cfc00;
      --gold: #ffe14d;
      --swamp-dark: rgba(13, 31, 13, 0.92);
      --die-size: 150px;                       /* the one die size; JS measures it */
      --half: calc(var(--die-size) / 2);
      --air: calc(var(--die-size) * 1.3);     /* headroom above the die for throws */
    }

    /* Smaller die on very narrow phones */
    @media (max-width: 360px) {
      :root { --die-size: 128px; }
    }

    * { box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 90px 16px 24px;
      background: #000 url('dice-swamp.webp') center / cover no-repeat;
      position: relative;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(45, 74, 43, 0.85) 0%, rgba(26, 46, 26, 0.85) 30%, rgba(13, 31, 13, 0.85) 60%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    /* ---------- Username bar ---------- */
    #username-picker {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      background: var(--swamp-dark);
      padding: 12px 20px;
      border-radius: 10px;
      border: 2px solid var(--lime);
      box-shadow: 0 0 15px rgba(124, 252, 0, 0.3);
      max-width: calc(100vw - 32px);
    }

    #username-picker label {
      color: var(--lime);
      font-family: 'Arial Black', sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }

    #username-picker select,
    #username-picker button {
      background: rgba(0, 0, 0, 0.5);
      color: var(--lime);
      border: 2px solid var(--lime);
      border-radius: 5px;
      padding: 5px 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    #username-picker select:focus-visible,
    #username-picker button:focus-visible {
      outline: none;
      box-shadow: 0 0 10px rgba(124, 252, 0, 0.6);
    }

    #username-picker select option { background: #0d1f0d; }

    #user-tag {
      color: #c8ff9a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    /* ---------- Arena + die ---------- */
    /* Arena the die moves around in */
    #dice-stage {
      position: relative;
      display: flex;
      width: min(380px, 100%);
      flex-shrink: 0;
      touch-action: manipulation;   /* rapid mid-air taps must not double-tap-zoom */
      -webkit-tap-highlight-color: transparent;
    }

    /* One lane per die; solo has one full-width lane, a duel splits the stage */
    .lane {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      height: var(--die-size);
    }
    .lane[hidden] { display: none; }

    #dice-stage.duel { width: min(520px, 100%); }
    /* Two dice side by side need to be smaller on a phone */
    @media (max-width: 760px) {
      #dice-stage.duel .lane {
        --die-size: 112px;
        --half: calc(var(--die-size) / 2);     /* re-derive: the :root value used the solo size */
      }
    }
    @media (max-width: 360px) {
      #dice-stage.duel .lane { --die-size: 96px; }
    }

    /* Name + state under each die in a duel */
    .lane-label {
      position: absolute;
      top: calc(100% + 30px);
      left: 4px;
      right: 4px;
      text-align: center;
      color: #c8ff9a;
      font-size: 13px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      pointer-events: none;
    }
    .lane-label[hidden] { display: none; }
    .lane-label .name { display: block; font-weight: bold; }
    .lane-label .state { display: block; color: rgba(200, 255, 154, 0.7); }
    .lane-label.win .name { color: var(--gold); text-shadow: 0 0 10px rgba(255, 225, 77, 0.7); }
    .lane-label.win .state { color: var(--gold); }

    .die-shadow {
      position: absolute;
      bottom: calc(var(--die-size) * -0.17);
      left: 50%;
      width: calc(var(--die-size) * 0.87);
      height: calc(var(--die-size) * 0.15);
      margin-left: calc(var(--die-size) * -0.435);
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.75) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0.85;
      pointer-events: none;
      will-change: transform, opacity;
      z-index: 1;
    }

    .die-mover {
      position: absolute;
      left: 50%;
      top: 0;
      width: var(--die-size);
      height: var(--die-size);
      margin-left: calc(var(--die-size) / -2);
      transform-origin: 50% 100%;
      will-change: transform;
      z-index: 2;
    }

    .thud      { animation: thud 0.18s ease-out; }
    .thud-hard { animation: thud 0.24s ease-out; --ty: 6px; }
    @keyframes thud {
      0%   { transform: translateY(0); }
      35%  { transform: translateY(var(--ty, 3px)); }
      100% { transform: translateY(0); }
    }

    .die-box {
      width: 100%;
      height: 100%;
      perspective: 800px;
      cursor: grab;
      outline: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .die-box:active { cursor: grabbing; }
    .die-box.airborne { cursor: pointer; }
    .die-box:focus-visible .face { border-color: var(--lime); }

    .die-box.holding { animation: shake 0.22s linear infinite; }
    .die-box.max { animation: goldGlow 1.8s ease-out; }
    .die-box.sad { animation: droop 1.6s ease-in-out; }

    @keyframes shake {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(-4px, 2px) rotate(-3deg); }
      50%  { transform: translate(3px, -3px) rotate(2deg); }
      75%  { transform: translate(-2px, -1px) rotate(-2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes goldGlow {
      0%   { filter: drop-shadow(0 0 0 rgba(255, 225, 77, 0)); }
      20%  { filter: drop-shadow(0 0 22px rgba(255, 225, 77, 0.95)) brightness(1.15); }
      100% { filter: drop-shadow(0 0 0 rgba(255, 225, 77, 0)); }
    }

    @keyframes droop {
      0%   { transform: none; filter: none; }
      25%  { transform: translateY(4px) rotate(-5deg); filter: grayscale(0.7) brightness(0.8); }
      75%  { transform: translateY(4px) rotate(-5deg); filter: grayscale(0.7) brightness(0.8); }
      100% { transform: none; filter: none; }
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      width: var(--die-size);
      height: var(--die-size);
      border: 2px solid #b5c99a;
      display: grid;
      padding: 8px;
      gap: 3px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.18), transparent 60%),
        var(--tint, #689f38);
      /* bevel: light top-left rim, dark bottom-right rim */
      box-shadow:
        inset 3px 3px 0 rgba(255, 255, 255, 0.18),
        inset -3px -3px 0 rgba(0, 0, 0, 0.25),
        inset 0 0 22px rgba(0, 0, 0, 0.28);
      backface-visibility: hidden;
      --shade: 0;
    }

    /* Directional lighting overlay, driven from JS */
    .face::after {
      content: '';
      position: absolute;
      inset: -2px;
      background: #000;
      opacity: var(--shade);
      pointer-events: none;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* small shadow so character art stays readable on any face color */
      filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.5));
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .face.one   { grid-template: 1fr / 1fr; place-items: center; padding: 14px; }
    .face.two,
    .face.three,
    .face.five  { grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
    .face.four  { grid-template: 1fr 1fr / 1fr 1fr; padding: 12px; gap: 10px; }
    .face.six   { grid-template: repeat(2, 1fr) / repeat(3, 1fr); }

    .front  { transform: rotateY(0deg)   translateZ(var(--half)); }
    .back   { transform: rotateY(180deg) translateZ(var(--half)); }
    .right  { transform: rotateY(90deg)  translateZ(var(--half)); }
    .left   { transform: rotateY(-90deg) translateZ(var(--half)); }
    .top    { transform: rotateX(90deg)  translateZ(var(--half)); }
    .bottom { transform: rotateX(-90deg) translateZ(var(--half)); }

    /* Face colors, shuffled per page load; the character art stays true-color */
    .tint-red    { --tint: #9c3f33; }
    .tint-blue   { --tint: #3d6a94; }
    .tint-mud    { --tint: #6b4f2e; }
    .tint-purple { --tint: #6a4c8c; }
    .tint-orange { --tint: #b06a24; }
    .tint-pink   { --tint: #a8577d; }

    #roll-hint {
      position: absolute;
      top: calc(100% + 44px);
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(200, 255, 154, 0.75);
      font-size: 13px;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .bump { animation: bump 0.22s ease-out; }
    @keyframes bump {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(4px); }
      60%  { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }

    .particle {
      position: absolute;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      background: radial-gradient(circle, #90ff00 0%, #7cfc00 30%, #228b22 100%);
      border-radius: 50%;
      pointer-events: none;
      animation: float-up 2s ease-out forwards;
      opacity: 0.8;
      box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                  inset 3px 3px 8px rgba(255, 255, 255, 0.4),
                  0 0 10px rgba(124, 252, 0, 0.5);
      z-index: 3;
    }

    /* "SOME…" call-out that pops above the die on each mid-air tap */
    .some-pop {
      position: absolute;
      transform: translate(-50%, 0);
      color: var(--lime);
      font: bold 22px 'Arial Black', sans-serif;
      text-shadow: 2px 2px 0 #1b3a10, 0 0 10px rgba(124, 252, 0, 0.6);
      white-space: nowrap;
      pointer-events: none;
      z-index: 4;
      animation: somePop 0.75s ease-out forwards;
    }
    @keyframes somePop {
      0%   { opacity: 0; transform: translate(-50%, 8px) scale(calc(var(--s, 1) * 0.6)) rotate(var(--r, 0deg)); }
      20%  { opacity: 1; transform: translate(-50%, -6px) scale(calc(var(--s, 1) * 1.1)) rotate(var(--r, 0deg)); }
      100% { opacity: 0; transform: translate(-50%, -46px) scale(var(--s, 1)) rotate(var(--r, 0deg)); }
    }

    .particle.gold {
      background: radial-gradient(circle, #fff6b0 0%, #ffe14d 35%, #c99a00 100%);
      box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.25),
                  inset 3px 3px 8px rgba(255, 255, 255, 0.5),
                  0 0 12px rgba(255, 225, 77, 0.7);
      animation: burst 1.4s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
    }

    @keyframes float-up {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.7; }
      100% { transform: translate(var(--drift), -200px) scale(0); opacity: 0; }
    }

    @keyframes burst {
      0%   { transform: translate(0, 0) scale(0.4); opacity: 1; }
      100% { transform: translate(var(--bx), var(--by)) scale(0); opacity: 0; }
    }

    /* ---------- Rolls panel ---------- */
    #rolls-panel {
      background: var(--swamp-dark);
      border: 3px solid var(--lime);
      border-radius: 15px;
      padding: 20px;
      width: 300px;
      max-width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(124, 252, 0, 0.3);
    }

    #rolls-panel h2 {
      color: var(--lime);
      font-family: 'Arial Black', sans-serif;
      text-align: center;
      margin: 0 0 15px;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #current-result {
      color: var(--lime);
      font-size: 28px;
      font-weight: bold;
      font-family: 'Arial Black', sans-serif;
      text-align: center;
      margin-bottom: 20px;
      min-height: 35px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #current-result.pop { animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
    #current-result.max { color: var(--gold); text-shadow: 0 0 12px rgba(255, 225, 77, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.8); }
    #current-result.min { color: #ff8a65; animation: sadText 1.2s ease-out forwards; }

    @keyframes pop {
      0%   { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    @keyframes sadText {
      0%   { transform: scale(0.4); opacity: 0; }
      30%  { transform: scale(1);   opacity: 1; }
      100% { transform: translateY(5px) rotate(-4deg); opacity: 0.85; }
    }

    #rolls-list {
      list-style: none;
      margin: 0;
      padding: 0;
      color: var(--lime);
      font-size: 15px;
    }

    #rolls-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 5px;
      border-left: 3px solid var(--lime);
    }

    #rolls-list li.mine {
      background: rgba(124, 252, 0, 0.12);
      border-left-color: var(--gold);
    }

    #rolls-list li.fresh { animation: slideIn 0.4s ease-out; }

    @keyframes slideIn {
      from { transform: translateX(-12px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    #rolls-list .who { min-width: 0; overflow-wrap: anywhere; line-height: 1.35; }
    #rolls-list .who b { color: #c8ff9a; }
    #rolls-list .ago { flex-shrink: 0; font-size: 12px; color: rgba(124, 252, 0, 0.65); }

    #rolls-list .empty {
      border: 0;
      background: none;
      justify-content: center;
      color: rgba(124, 252, 0, 0.6);
      font-style: italic;
    }

    /* Duel result lines: a small DUEL tag and the score */
    #rolls-list .tag {
      display: inline-block;
      margin-right: 6px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--gold);
      color: #1b2a0e;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      vertical-align: 2px;
    }
    #rolls-list .score { color: var(--gold); font-weight: 700; white-space: nowrap; }

    /* ---------- Duel box (top of the rolls panel) ---------- */
    #duel-box {
      margin: 0 0 16px;
      padding-bottom: 14px;
      border-bottom: 1px dashed rgba(124, 252, 0, 0.4);
      text-align: center;
    }
    #duel-box button {
      background: rgba(0, 0, 0, 0.5);
      color: var(--lime);
      border: 2px solid var(--lime);
      border-radius: 6px;
      padding: 7px 12px;
      font: bold 14px Arial, sans-serif;
      cursor: pointer;
    }
    #duel-box button:disabled { opacity: 0.45; cursor: default; }
    #duel-box button:focus-visible { outline: none; box-shadow: 0 0 10px rgba(124, 252, 0, 0.6); }
    #duel-box button.primary { background: var(--lime); color: #0d1f0d; }
    #duel-info[hidden], #duel-box button[hidden] { display: none; }
    #duel-vs {
      color: #c8ff9a;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
    #duel-status {
      margin: 6px 0 10px;
      min-height: 1.3em;
      color: rgba(200, 255, 154, 0.85);
      font-size: 13px;
    }
    .duel-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

    #status-note {
      margin-top: 8px;
      color: #ffb74d;
      font-size: 12px;
      text-align: center;
    }

    /* ---------- Small screens ---------- */
    @media (max-width: 760px) {
      body {
        flex-direction: column;
        justify-content: flex-start;
        gap: 24px;
        padding-top: 24px;
      }
      #username-picker {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 100%;
        max-width: 420px;
      }
      /* Room above for the throw arc, below for the shadow and hint */
      #dice-stage { margin: var(--air) 0 64px; }
      #rolls-panel { max-height: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .die-box.holding,
      .die-box.max,
      .die-box.sad,
      #current-result.pop,
      #current-result.min,
      #rolls-list li.fresh,
      .bump, .thud, .thud-hard { animation: none; }
      .particle, .some-pop { display: none; }
    }
  </style>
</head>
<body>
  <div id="username-picker">
    <label for="adjective-select">Username:</label>
    <select id="adjective-select" aria-label="Adjective">
      <option>Lucky</option><option>Unlucky</option><option>Blessed</option><option>Cursed</option>
      <option>Risky</option><option>Golden</option><option>Swampy</option><option>Ogre</option>
      <option>Onion</option><option>Layered</option><option>Muddy</option><option>Stinky</option>
      <option>Crusty</option><option>Saucy</option><option>Enchanted</option><option>Wicked</option>
      <option>Royal</option><option>Swollen</option><option>Soft</option><option>Magic</option>
      <option>Dirty</option><option>Sloppy</option>
    </select>
    <select id="character-select" aria-label="Character">
      <option>Shrek</option><option>Fiona</option><option>Donkey</option><option>Puss</option>
      <option>Farquaad</option><option>Dragon</option><option>Gingy</option><option>Pinocchio</option>
      <option>BigBadWolf</option><option>ThreePigs</option><option>BlindMice</option><option>Boots</option>
      <option>Cookie</option><option>Tail</option><option>Swamp</option><option>Castle</option>
      <option>Onion</option><option>Parfait</option><option>Muffin</option><option>Waffles</option>
      <option>Throne</option><option>Wand</option><option>Potion</option><option>Godmother</option>
      <option>Mirror</option><option>Outhouse</option>
    </select>
    <span id="user-tag" title="This is how you'll appear in the roll list"></span>
    <button id="mute-btn" type="button" aria-pressed="false" title="Toggle sound">🔊</button>
  </div>

  <div id="dice-stage">
    <!-- My die (spectators see player 1 here). Faces are built in JS. -->
    <div class="lane" id="lane-left">
      <div class="die-shadow"></div>
      <div class="die-mover">
        <div class="die-box" id="dice-container" role="button" tabindex="0" aria-label="Roll the Shrek die">
          <div class="cube"></div>
        </div>
      </div>
      <div class="lane-label" hidden></div>
    </div>
    <!-- Opponent's die, only shown in a duel -->
    <div class="lane" id="lane-right" hidden>
      <div class="die-shadow"></div>
      <div class="die-mover">
        <div class="die-box" aria-hidden="true">
          <div class="cube"></div>
        </div>
      </div>
      <div class="lane-label"></div>
    </div>
    <div id="roll-hint">tap to shroll · hold to shake · flick to throw</div>
  </div>

  <div id="rolls-panel">
    <section id="duel-box" aria-label="Duel">
      <button id="duel-btn" type="button">Challenge a friend</button>
      <div id="duel-info" hidden>
        <div id="duel-vs"></div>
        <div id="duel-status" aria-live="polite"></div>
        <div class="duel-actions">
          <button id="duel-action" class="primary" type="button"></button>
          <button id="duel-share" type="button">Share link</button>
          <button id="duel-leave" type="button">Leave</button>
        </div>
      </div>
    </section>
    <h2>LAST 6 SHROLLS</h2>
    <div id="current-result" aria-live="polite"></div>
    <ul id="rolls-list"></ul>
    <div id="status-note" hidden></div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- type="module" runs after the deferred Firebase scripts, without blocking page render -->
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const result      = $('current-result');
    const diceStage   = $('dice-stage');
    const laneLeft    = $('lane-left');
    const laneRight   = $('lane-right');
    const myBox       = $('dice-container');
    const rollsPanel  = $('rolls-panel');
    const rollsList   = $('rolls-list');
    const adjSelect   = $('adjective-select');
    const charSelect  = $('character-select');
    const userTag     = $('user-tag');
    const muteBtn     = $('mute-btn');
    const statusNote  = $('status-note');
    const rollHint    = $('roll-hint');
    const picker      = $('username-picker');
    const duelBtn     = $('duel-btn');
    const duelInfo    = $('duel-info');
    const duelVs      = $('duel-vs');
    const duelStatus  = $('duel-status');
    const duelAction  = $('duel-action');
    const duelShare   = $('duel-share');
    const duelLeave   = $('duel-leave');

    const MAX_SHOWN = 6;
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---------- Helpers ----------
    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
        catch { return fallback; }
      },
      set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
      remove(key) { try { localStorage.removeItem(key); } catch {} }
    };

    const randInt = (n) => {
      if (crypto?.getRandomValues) {
        const buf = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / n) * n;
        do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const mod = (n, m) => ((n % m) + m) % m;
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    const plural = (v) => `${v} SHREK${v === 1 ? '' : 'S'}`;
    const vibrate = (p) => { try { navigator.vibrate?.(p); } catch {} };

    // Restart a CSS animation class on an element
    function flash(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
      el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
    }

    // ---------- Username (persists across visits) ----------
    const saved = store.get('shrekDiceUser', null);
    if (saved && typeof saved.number === 'number') {
      adjSelect.selectedIndex  = Math.min(saved.adj  ?? 0, adjSelect.options.length - 1);
      charSelect.selectedIndex = Math.min(saved.char ?? 0, charSelect.options.length - 1);
    } else {
      adjSelect.selectedIndex  = randInt(adjSelect.options.length);
      charSelect.selectedIndex = randInt(charSelect.options.length);
    }
    const userNumber = saved && typeof saved.number === 'number' ? saved.number : randInt(100);

    let userId = '';
    function updateUsername() {
      userId = `${adjSelect.value}${charSelect.value}${userNumber}`;
      userTag.textContent = userId;
      store.set('shrekDiceUser', { adj: adjSelect.selectedIndex, char: charSelect.selectedIndex, number: userNumber });
      renderRolls();
    }
    adjSelect.addEventListener('change', updateUsername);
    charSelect.addEventListener('change', updateUsername);

    // ---------- Sound (Web Audio, with HTML audio fallback) ----------
    let muted = store.get('shrekDiceMuted', false);
    let actx = null;
    const buffers = {};
    // Clip name -> file in the repo root
    const CLIPS = {
      some:   'dice-some.mp3',
      body:   'dice-body.mp3',
      fart:   'dice-fart.mp3',
      heynow: 'heynow.mp3'
    };
    // Per-clip volume trim (1 = as recorded)
    const CLIP_GAIN = { heynow: 0.5 };
    const fallback = Object.fromEntries(Object.entries(CLIPS).map(([n, file]) => [n, new Audio(file)]));

    // Download the clips at page load so the first tap only has to decode them
    const clipData = {};
    for (const [name, file] of Object.entries(CLIPS)) {
      clipData[name] = fetch(file).then(r => r.arrayBuffer()).catch(() => null);
    }

    // Create (or wake) the audio context and decode the downloaded clips
    function initAudio() {
      if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      for (const name of Object.keys(CLIPS)) {
        clipData[name]
          .then(b => b && actx.decodeAudioData(b))
          .then(buf => { if (buf) buffers[name] = buf; })
          .catch(() => {});
      }
    }
    // Any first touch on the page starts decoding, not just a touch on the die
    addEventListener('pointerdown', initAudio, { once: true, capture: true });

    // Returns stop() so a clip can be cut short (used when juggling "SOME")
    function play(name, volume = 1, rate = 1) {
      if (muted) return () => {};
      if (actx && buffers[name]) {
        const src = actx.createBufferSource();
        const g = actx.createGain();
        src.buffer = buffers[name];
        src.playbackRate.value = rate;
        g.gain.value = volume * (CLIP_GAIN[name] ?? 1);
        src.connect(g).connect(actx.destination);
        src.start();
        return () => {
          try {
            const t = actx.currentTime;
            g.gain.setValueAtTime(g.gain.value, t);
            g.gain.linearRampToValueAtTime(0, t + 0.04);
            src.stop(t + 0.05);
          } catch {}
        };
      } else {
        const a = fallback[name];
        try { a.currentTime = 0; } catch {}
        a.volume = clamp(volume * (CLIP_GAIN[name] ?? 1), 0, 1);
        a.play().catch(() => {});
        return () => { try { a.pause(); } catch {} };
      }
    }

    // "BODY" remembers (per die) when it started so a tail clip (fart on a 1,
    // Hey Now on a 6) can follow right after it
    function playBody(die) { die.bodyAt = performance.now(); play('body', die.vol); }
    function playAfterBody(die, name) {
      const bodyMs = (buffers.body?.duration ?? 0.57) * 1000 - 80;   // overlap BODY's tail a little
      clearTimeout(die.tailTimer);
      die.tailTimer = setTimeout(() => play(name, die.vol), Math.max(0, die.bodyAt + bodyMs - performance.now()));
    }
    const cancelAfterBody = (die) => clearTimeout(die.tailTimer);

    // Procedural clack: a tiny filtered noise burst — no audio file needed
    let noiseBuf = null;
    function clack(volume = 0.5, pitch = 1) {
      if (muted || !actx) return;
      if (!noiseBuf) {
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4);
      }
      const t = actx.currentTime;
      const src = actx.createBufferSource();
      const bp = actx.createBiquadFilter();
      const g = actx.createGain();
      src.buffer = noiseBuf;
      bp.type = 'bandpass';
      bp.frequency.value = 1800 * pitch;
      bp.Q.value = 4;
      g.gain.setValueAtTime(volume, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      src.connect(bp).connect(g).connect(actx.destination);
      src.start(t);
    }

    function syncMute() {
      muteBtn.textContent = muted ? '🔇' : '🔊';
      muteBtn.setAttribute('aria-pressed', String(muted));
      muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    }
    muteBtn.addEventListener('click', () => { muted = !muted; store.set('shrekDiceMuted', muted); syncMute(); });
    syncMute();

    // ---------- Feed state ----------
    // The shared list is 6 reusable slots at feed/slots/0-5. Each entry is a
    // roll { kind: 'roll', user, value, time } or a duel result
    // { kind: 'duel', user (winner), value, vs (loser), vsValue, time }.
    // server:  entries the database has sent us, keyed by slot number
    // pending: my entries not yet in a slot, or local-only
    // status:  connection state, which picks the note under the list
    const FEED_SIZE = MAX_SHOWN;
    const feed = { server: [], pending: [], status: 'connecting' };
    let serverOffset = 0;                       // server clock minus this device's clock
    const serverNow = () => Date.now() + serverOffset;
    let localSeq = 0;

    const FEED_NOTES = {
      connecting:   '',
      live:         '',
      reconnecting: 'Reconnecting to the swamp…',
      unreachable:  "Can't reach the swamp. Showing your shrolls only.",
      unavailable:  'Shared roll list unavailable — showing your rolls only.',
      rejected:     "That shroll didn't reach the swamp."
    };

    // Newest-first entries to show: the slots plus my unconfirmed ones
    function visibleEntries() {
      return [...feed.server, ...feed.pending]
        .sort((a, b) => a.time - b.time)
        .slice(-MAX_SHOWN)
        .reverse();
    }

    function setFeedStatus(status) {
      feed.status = status;
      renderStatus();
    }

    // Checks a slot's data from the database; null if it isn't a valid entry
    function cleanEntry(key, raw) {
      if (!raw || typeof raw !== 'object') return null;
      const cleanName = (v) => (typeof v === 'string' && v.trim() ? v.trim().slice(0, 40) : 'Someone');
      const isFace = (v) => Number.isInteger(v) && v >= 1 && v <= 6;
      const value = Number(raw.value), time = Number(raw.time);
      if (!isFace(value) || !Number.isFinite(time)) return null;
      const entry = { key, kind: 'roll', user: cleanName(raw.user), value, time: Math.min(time, serverNow()) };
      if (raw.kind === 'duel') {
        const vsValue = Number(raw.vsValue);
        if (!isFace(vsValue) || vsValue >= value) return null;
        Object.assign(entry, { kind: 'duel', vs: cleanName(raw.vs), vsValue });
      }
      return entry;
    }

    // The old per-device stats are gone; clear what earlier versions stored
    store.remove('shrekDiceMyRolls');

    // ---------- Feed rendering ----------
    let lastNewestKey = null;

    function renderStatus() {
      const note = FEED_NOTES[feed.status];
      statusNote.textContent = note;
      statusNote.hidden = !note;
    }

    function timeAgo(t) {
      const s = Math.max(0, Math.floor((serverNow() - t) / 1000));
      if (s < 5)     return 'just now';
      if (s < 60)    return `${s}s ago`;
      if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    // One list item's text: "Name rolled 4 SHREKS" or "DUEL Winner out-shrekked Loser 6–3"
    function entryText(entry) {
      const who = document.createElement('span');
      who.className = 'who';
      const bold = (text) => { const b = document.createElement('b'); b.textContent = text; return b; };
      if (entry.kind === 'duel') {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'DUEL';
        const score = document.createElement('span');
        score.className = 'score';
        score.textContent = `${entry.value}–${entry.vsValue}`;
        who.append(tag, bold(entry.user), ' out\u2011shrekked ', bold(entry.vs), ' ', score);   // \u2011: hyphen that won't wrap
      } else {
        who.append(bold(entry.user), ` rolled ${plural(entry.value)}`);
      }
      return who;
    }

    // DOM + textContent so names from the shared database can't inject HTML
    function renderRolls() {
      const shown = visibleEntries();
      const newestKey = shown[0]?.key ?? null;
      const isNew = lastNewestKey !== null && newestKey !== lastNewestKey;
      lastNewestKey = newestKey;
      rollsList.replaceChildren();

      if (!shown.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'No shrolls yet. Be the first!';
        rollsList.append(li);
        return;
      }

      shown.forEach((entry, i) => {
        const li = document.createElement('li');
        if (entry.user === userId || entry.vs === userId) li.classList.add('mine');
        if (i === 0 && isNew) li.classList.add('fresh');
        const ago = document.createElement('span');
        ago.className = 'ago';
        ago.dataset.time = entry.time;
        ago.textContent = timeAgo(entry.time);
        li.append(entryText(entry), ago);
        rollsList.append(li);
      });
    }

    setInterval(() => {
      if (document.hidden) return;
      rollsList.querySelectorAll('.ago').forEach(el => { el.textContent = timeAgo(Number(el.dataset.time)); });
    }, 1000);

    // ---------- Firebase (falls back to local-only) ----------
    let db = null, everConnected = false;
    try {
      firebase.initializeApp({ databaseURL: 'https://shrek-dice-default-rtdb.firebaseio.com/' });
      db = firebase.database();

      // All 6 slots; the list sorts them by server time
      db.ref('feed/slots').on('value', (snapshot) => {
        const next = [];
        snapshot.forEach(child => { const e = cleanEntry(child.key, child.val()); if (e) next.push(e); });
        feed.server = next;
        renderRolls();
      }, (err) => {
        console.warn('Shroll feed closed:', err?.message);
        setFeedStatus('unavailable');
      });

      db.ref('.info/serverTimeOffset').on('value', snap => { serverOffset = Number(snap.val()) || 0; });

      // Connection state drives the note; "unreachable" if we never connect at all
      db.ref('.info/connected').on('value', snap => {
        if (feed.status === 'unavailable') return;
        if (snap.val() === true) { everConnected = true; setFeedStatus('live'); }
        else if (everConnected) setFeedStatus('reconnecting');
      });
      setTimeout(() => { if (feed.status === 'connecting') setFeedStatus('unreachable'); }, 6000);
    } catch {
      db = null;
      setFeedStatus('unavailable');
    }

    // Shows an entry right away, then claims the next slot (counter at feed/next)
    // and writes it there, overwriting the oldest entry
    function postToFeed(fields) {
      const entry = { key: `local-${++localSeq}`, ...fields, time: serverNow() };
      feed.pending.push(entry);
      renderRolls();
      if (!db) return;

      const keepLocal = (err) => {
        console.warn('Shroll not saved:', err?.message);
        if (!feed.pending.includes(entry)) feed.pending.push(entry);
        setFeedStatus('rejected');
        renderRolls();
      };

      db.ref('feed/next').transaction(n => (Number.isInteger(n) ? n : 0) + 1)
        .then(({ committed, snapshot }) => {
          if (!committed) throw new Error('No feed slot claimed');
          const slot = String(snapshot.val() % FEED_SIZE);
          // The slot's own listener event takes over from the pending copy
          feed.pending = feed.pending.filter(e => e !== entry);
          if (lastNewestKey === entry.key) lastNewestKey = slot;
          return db.ref(`feed/slots/${slot}`).set({ ...fields, time: firebase.database.ServerValue.TIMESTAMP });
        })
        .then(() => {
          if (feed.status === 'rejected') setFeedStatus('live');
        })
        .catch(keepLocal);
    }

    const postRoll = (value) => postToFeed({ kind: 'roll', user: userId, value });


    // ---------- Die faces and art ----------
    // Which character is the pip on each face. A null file uses the Shrek pip
    // until that art is in the repo; fill in the filename when it lands.
    const PIP = 'dice-shrek.webp';
    const CAST = {
      one:   { name: 'Lord Farquaad', file: null },   // future: 'dice-farquaad.webp'
      two:   { name: 'Donkey',        file: null },   // future: 'dice-donkey.webp'
      three: { name: 'Gingy',         file: null },   // future: 'dice-gingy.webp'
      four:  { name: 'Puss in Boots', file: null },   // future: 'dice-puss.webp'
      five:  { name: 'Fiona',         file: null },   // future: 'dice-fiona.webp'
      six:   { name: 'Shrek',         file: PIP }
    };
    // Pip grids per face (0 = empty cell)
    const LAYOUTS = {
      one:   [1],
      two:   [1,0,0, 0,0,0, 0,0,1],
      three: [1,0,0, 0,1,0, 0,0,1],
      four:  [1,1, 1,1],
      five:  [1,0,1, 0,1,0, 1,0,1],
      six:   [1,1,1, 1,1,1]
    };
    // Each face's CSS classes (position, value) and outward normal for lighting
    const FACE_DEFS = [
      ['front',  'one',   [0, 0, 1]],
      ['back',   'six',   [0, 0, -1]],
      ['right',  'three', [1, 0, 0]],
      ['left',   'four',  [-1, 0, 0]],
      ['top',    'five',  [0, -1, 0]],
      ['bottom', 'two',   [0, 1, 0]]
    ];
    const TINTS = ['tint-red', 'tint-blue', 'tint-mud', 'tint-purple', 'tint-orange', 'tint-pink'];

    // Returns a shuffled copy (Fisher-Yates)
    function shuffled(list) {
      const a = [...list];
      for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Builds the six faces inside a cube, each with a random tint; returns them
    function buildFaces(cube) {
      const tints = shuffled(TINTS);
      return FACE_DEFS.map(([side, key, normal], i) => {
        const face = document.createElement('div');
        face.className = `face ${side} ${key} ${tints[i]}`;
        const art = CAST[key].file || PIP;
        LAYOUTS[key].forEach(on => {
          const el = document.createElement(on ? 'img' : 'div');
          if (on) {
            el.alt = '';
            el.decoding = 'async';
            // A missing or broken file falls back to the Shrek pip (once, so no loop)
            el.addEventListener('error', () => { el.src = PIP; }, { once: true });
            el.src = art;
          }
          face.append(el);
        });
        face._n = normal;
        cube.append(face);
        return face;
      });
    }

    // ---------- Lighting ----------
    // Light comes from the viewer's upper-left. Each face is darkened by how far
    // its normal points away from the light after the cube's rotation.
    const L = (() => { const v = [-0.45, -0.6, 0.66]; const m = Math.hypot(...v); return v.map(c => c / m); })();
    function shade(faces, rxDeg, ryDeg) {
      const a = rxDeg * Math.PI / 180, b = ryDeg * Math.PI / 180;
      const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
      for (const f of faces) {
        const [x, y, z] = f._n;
        // rotateY(b) then rotateX(a), matching CSS "rotateX(a) rotateY(b)"
        const x1 = x * cb + z * sb, z1 = -x * sb + z * cb;
        const y2 = y * ca - z1 * sa, z2 = y * sa + z1 * ca;
        const lit = Math.max(0, x1 * L[0] + y2 * L[1] + z2 * L[2]);
        // Facing the viewer at rest = fully lit; turned away = up to 60% darker
        f.style.setProperty('--shade', clamp(0.6 * (1 - lit / L[2]), 0, 0.6).toFixed(3));
      }
    }

    // ---------- Die ----------
    // Cube rotation (rotateX, rotateY) that brings each face to the front
    const FACES = [
      { x: 0,   y: 0,   value: 1 },
      { x: 0,   y: 180, value: 6 },
      { x: 0,   y: 90,  value: 4 },
      { x: 0,   y: -90, value: 3 },
      { x: -90, y: 0,   value: 5 },
      { x: 90,  y: 0,   value: 2 }
    ];
    const faceOf = (value) => FACES.find(f => f.value === value);

    // Grows the die slightly with height (rigid: uniform scale, anchored at its base)
    const LIFT = 0.12;

    // One die in one lane: its state and how it draws itself. In a duel there are
    // two; the left one takes my input, the right one replays the other player.
    function createDie(lane) {
      const mover  = lane.querySelector('.die-mover');
      const box    = lane.querySelector('.die-box');
      const cube   = lane.querySelector('.cube');
      const shadow = lane.querySelector('.die-shadow');
      const faces  = buildFaces(cube);

      const die = {
        lane, box,
        size: 150,              // px, measured from CSS --die-size so CSS stays the single source
        rotX: 0, rotY: 0,       // resting rotation
        rolling: false,
        replaying: false,       // showing someone else's throw: quieter, no vibration
        vol: 1,
        juggle: null,           // while airborne: kicks the die back up; null when grounded
        stopSome: () => {},
        bodyAt: 0, tailTimer: 0,

        measure() { die.size = mover.offsetWidth || 150; },

        render(x, h, tiltX, tiltZ, rx, ry, H) {
          const lift = 1 + (h / die.size) * LIFT;
          mover.style.transform = `translate(${x}px, ${-h}px) scale(${lift})`;
          cube.style.transform = `rotateX(${tiltX}deg) rotateZ(${tiltZ}deg) rotateX(${rx}deg) rotateY(${ry}deg)`;
          const k = H ? Math.min(h / H, 1) : 0;
          shadow.style.transform = `translateX(${x}px) scale(${1 - k * 0.55})`;
          shadow.style.opacity = (0.85 - k * 0.6).toFixed(3);
          shade(faces, rx, ry);
        },

        // Rest on the target face with no animation
        snap(target) {
          die.rotX += mod(target.x - die.rotX, 360);
          die.rotY += mod(target.y - die.rotY, 360);
          die.render(0, 0, 0, 0, die.rotX, die.rotY, 0);
        },

        // Highest the die may fly (px above its resting spot) without going under
        // the name bar or off the top of the screen
        ceiling() {
          const stage = lane.getBoundingClientRect();
          const bar = picker.getBoundingClientRect();
          const barAbove = bar.top < stage.top && bar.right > stage.left && bar.left < stage.right;
          const roof = Math.max(0, barAbove ? bar.bottom : 0) + 8;
          return Math.max(60, (stage.top - roof) / (1 + LIFT));
        }
      };
      die.measure();
      die.render(0, 0, 0, 0, 0, 0, 0);
      return die;
    }

    const myDie  = createDie(laneLeft);
    const oppDie = createDie(laneRight);
    addEventListener('resize', () => { myDie.measure(); oppDie.measure(); });

    // ---------- Particles and call-outs ----------
    function bubbles(die, count, x, gold = false) {
      if (reducedMotion) return;
      const cx = die.lane.clientWidth / 2 + x;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = gold ? 'particle gold' : 'particle';
        if (gold) {
          const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 110;
          p.style.left = cx + 'px';
          p.style.top = die.size / 2 + 'px';
          p.style.setProperty('--bx', `${Math.cos(ang) * dist}px`);
          p.style.setProperty('--by', `${Math.sin(ang) * dist - 40}px`);
          p.style.width = p.style.height = `${10 + Math.random() * 16}px`;
        } else {
          const spread = die.size * 0.87;
          p.style.left = cx - spread / 2 + Math.random() * spread + 'px';
          p.style.top = Math.random() * spread + 'px';
          p.style.setProperty('--drift', `${(Math.random() - 0.5) * 100}px`);
          p.style.animationDelay = `${Math.random() * 0.3}s`;
        }
        die.lane.appendChild(p);
        setTimeout(() => p.remove(), 2400);
      }
    }

    function somePop(die, x, h, n) {
      const el = document.createElement('div');
      el.className = 'some-pop';
      el.setAttribute('aria-hidden', 'true');
      el.textContent = n >= 3 ? `SOME… ×${n + 1}` : 'SOME…';
      // Beside the die (alternating sides) so it never hides under the header
      const w = die.lane.clientWidth;
      const side = n % 2 ? 1 : -1;
      const cx = clamp(w / 2 + x + side * die.size * 0.75, 60, Math.max(60, w - 60));
      el.style.left = `${cx}px`;
      el.style.top = `${die.size * 0.27 - h + (Math.random() - 0.5) * 20}px`;
      el.style.setProperty('--s', String(Math.min(1 + n * 0.06, 1.5)));
      el.style.setProperty('--r', `${(Math.random() - 0.5) * 16}deg`);
      die.lane.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // ---------- Throw engine ----------
    // One continuous motion: arc up while tumbling, slam down, one small hop,
    // a short rock to rest. Each mid-air tap re-plans the rest of the flight
    // from wherever the die is — but always toward the same pre-chosen target.
    // onJuggle(ms since the throw began) reports each accepted mid-air tap.
    function animateThrow(die, { dir, strength, target, onJuggle }) {
      const k = die.size / 150;                    // tuned at 150px; scale to the real die
      const maxH = die.ceiling();                  // highest the die may fly this roll
      const maxDx = Math.max(0, (die.lane.clientWidth - die.size) / 2 - 6);
      const reach = maxDx * clamp(0.45 + strength * 0.45, 0.4, 1);
      const H = Math.min(clamp(95 * strength + 25, 70, 150) * k, maxH);
      const tArc = 480 + 220 * strength;
      const g = 8 * H / (tArc * tArc);              // gravity (px/ms²) that gives this arc
      const HOP = 150, hopH = Math.min(10, H * 0.07);
      const tSettle = 220;
      const rockDir = Math.random() < 0.5 ? -1 : 1;
      const tStart = performance.now();

      let seg = null, peak = H, boosts = 0, lastBoost = -1e9;
      const cur = { h: 0, x: 0, rx: die.rotX, ry: die.rotY };

      // A flight: launched at t0 from height h0 with upward speed v0, travelling
      // sideways along xPath(p), spinning from (sX, sY) to rest on the target.
      function plan(t0, h0, v0, xPath, sX, sY, spins) {
        const tAir = (v0 + Math.sqrt(v0 * v0 + 2 * g * h0)) / g;
        seg = {
          t0, h0, v0, tAir, tLand: tAir + HOP, xPath, sX, sY,
          eX: sX + 360 * spins       + mod(target.x - sX, 360),
          eY: sY + 360 * (spins + 1) + mod(target.y - sY, 360),
          landed: false, hopped: false
        };
        peak = Math.max(H, h0 + (v0 * v0) / (2 * g));
      }

      // Initial throw: straight from the floor, out to the side and back
      plan(tStart, 0, 4 * H / tArc,
           p => dir * reach * Math.sin(Math.PI * Math.pow(p, 0.6)),
           die.rotX, die.rotY, 1 + Math.round(strength * 1.6));

      return new Promise(resolve => {
        // Returns true when the tap counted (not debounced, still airborne)
        die.juggle = () => {
          const now = performance.now();
          if (now - lastBoost < 90) return false;    // ignore accidental double-fires
          lastBoost = now;
          boosts++;

          // Little jump from the current height, never above the ceiling
          const apex = clamp(cur.h + (55 + 20 * strength) * k, cur.h + 25 * k, Math.max(maxH, cur.h));
          const v0 = Math.sqrt(2 * g * (apex - cur.h));
          const x0 = cur.x;
          const drift = (Math.random() - 0.5) * maxDx * 0.7;
          plan(now, cur.h, v0,
               p => clamp(x0 * (1 - p) + drift * Math.sin(Math.PI * p), -maxDx, maxDx),
               cur.rx, cur.ry, 1);

          // "SOME…" again, a touch higher-pitched each time
          die.stopSome();
          die.stopSome = play('some', die.vol, 1 + Math.min(boosts, 8) * 0.04);
          clack(0.22 * die.vol, 1.4);
          if (!die.replaying) vibrate(12);
          bubbles(die, 4, x0);
          somePop(die, x0, cur.h, boosts);
          onJuggle?.(now - tStart);
          return true;
        };

        function frame(now) {
          const s = seg;
          const t = Math.max(0, now - s.t0);

          // Height: free flight under gravity, then one tiny hop
          let h = 0;
          if (t < s.tAir) h = Math.max(0, s.h0 + s.v0 * t - 0.5 * g * t * t);
          else if (t < s.tLand) { const u = (t - s.tAir) / HOP; h = 4 * hopH * u * (1 - u); }
          // Juggling ends at the first floor hit, so "BODY" plays once per roll
          if (!s.landed && t >= s.tAir) { s.landed = true; die.juggle = null; onImpact(die, 'floor', strength); }
          if (!s.hopped && t >= s.tLand) { s.hopped = true; onImpact(die, 'hop', strength); }

          const p = Math.min(t / s.tLand, 1);
          const x = s.xPath(p);

          // Spin fast at first, slowing to land exactly on the target face
          const e = 1 - Math.pow(1 - p, 3.2);
          const rx = s.sX + (s.eX - s.sX) * e;
          const ry = s.sY + (s.eY - s.sY) * e;

          // One quick, stiff rock after landing
          let tiltX = 0, tiltZ = 0;
          if (t > s.tLand) {
            const w = Math.min((t - s.tLand) / tSettle, 1);
            const amp = (1.5 + 1.5 * strength) * (1 - w);
            tiltZ = rockDir * amp * Math.sin(w * Math.PI * 2);
            tiltX = amp * 0.4 * Math.sin(w * Math.PI * 2);
          }

          Object.assign(cur, { h, x, rx, ry });
          die.render(x, h, tiltX, tiltZ, rx, ry, peak);

          if (t < s.tLand + tSettle) requestAnimationFrame(frame);
          else {
            die.juggle = null;
            die.rotX = s.eX; die.rotY = s.eY;
            die.render(0, 0, 0, 0, die.rotX, die.rotY, H);
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    function onImpact(die, kind, strength) {
      if (kind === 'floor') {
        playBody(die);                      // "SOME…BODY" lands on the first hit
        flash(die.lane, strength > 0.9 ? 'thud-hard' : 'thud');
        if (!die.replaying) {
          vibrate(Math.round(20 + 20 * strength));
          if (strength > 1) flash(rollsPanel, 'bump');
        }
      } else {
        clack(0.18 * die.vol, 1.2);
      }
    }

    // Throws a die onto a pre-chosen target and plays the landing feedback.
    // replay: someone else's throw. instant: just show the face (stale replays).
    async function throwDie(die, { dir, strength, target, replay = false, instant = false, onJuggle }) {
      die.rolling = true;
      die.replaying = replay;
      die.vol = replay ? 0.6 : 1;           // the other player's die is a little quieter
      cancelAfterBody(die);
      die.box.classList.add('airborne');
      die.box.classList.remove('max', 'sad');

      if (instant) {
        die.snap(target);
      } else {
        die.stopSome = play('some', die.vol);
        bubbles(die, 12, 0);
        if (reducedMotion) {
          die.snap(target);
          await wait(250);
          playBody(die);
        } else {
          await animateThrow(die, { dir, strength, target, onJuggle });
        }
        landingFeedback(die, target.value);
      }

      die.box.classList.remove('airborne');
      die.rolling = false;
    }

    // Gold and Hey Now for a 6, droop and fart for a 1
    function landingFeedback(die, value) {
      if (value === 6) {
        flash(die.box, 'max');
        bubbles(die, 30, 0, true);
        if (!die.replaying) vibrate([30, 60, 30]);
        playAfterBody(die, 'heynow');
      } else if (value === 1) {
        flash(die.box, 'sad');
        playAfterBody(die, 'fart');
      }
    }

    // ---------- My roll ----------
    async function roll({ dir, strength = 1 } = {}) {
      if (myDie.rolling) return;
      if (inDuel() && !canDuelRoll()) { nudgeDuel(); return; }
      initAudio();
      rollHint.style.opacity = '0';
      result.textContent = '';
      result.className = '';

      dir = dir || (Math.random() < 0.5 ? -1 : 1);
      strength = clamp(strength, 0.5, 1.6);
      const target = FACES[randInt(FACES.length)];

      // In a duel the throw is streamed as it starts, juggles as they happen
      const duelThrow = inDuel() ? beginDuelThrow(target.value, dir, strength) : null;
      await throwDie(myDie, { dir, strength, target, onJuggle: duelThrow?.juggle });

      const { value } = target;
      result.textContent = `${plural(value)}!`;
      void result.offsetWidth;
      result.classList.add(value === 1 ? 'min' : 'pop');
      if (value === 6) result.classList.add('max');
      myBox.setAttribute('aria-label', `Rolled ${plural(value)}. Roll again`);

      if (!duelThrow) postRoll(value);   // duel rolls post one result line instead
      duelThrow?.landed();
    }

    // ---------- Duel state ----------
    // A two-player session shared through Firebase at sessions/{id}:
    //   players.{p1|p2} = { user, ready }   ready = highest round that player has agreed to
    //   rounds.{n}.{p1|p2} = { value, dir, strength, time, juggles: { key: ms } }
    // A round is open once both players are ready for it; each player gets one throw.
    const SLOTS = ['p1', 'p2'];
    const REPLAY_DELAY = 250;   // ms of buffer so streamed juggle taps arrive before they're due
    const STALE_MS = 8000;      // throws older than this snap into place instead of replaying
    const JUGGLE_WINDOW = 15000;

    const freshDuel = () => ({
      id: null,
      me: null,          // 'p1' | 'p2', or null when watching a full duel
      players: {},
      rounds: {},
      playback: {},      // `${round}:${slot}` -> 'flying' | 'landed' on this screen
      announced: 0,      // last round whose result was shown
      thrownHere: {},    // round -> true when I threw it on this page (not before a reload)
      round: 0,          // round the screen is showing, to notice when a new one starts
      creating: false,
      joining: false,
      note: '',          // short-lived message, e.g. "Link copied"
      problem: ''        // '' | 'offline' | 'missing' | 'unavailable' | 'rejected'
    });
    const duel = freshDuel();
    const replays = {};  // `${round}:${slot}` -> { start, die, instant, done: Set of juggle keys }
    let duelRef = null, tieTimer = 0, noteTimer = 0;

    const inDuel     = () => duel.id !== null;
    const other      = (s) => (s === 'p1' ? 'p2' : 'p1');
    const leftSlot   = () => duel.me || 'p1';
    const dieFor     = (s) => (s === leftSlot() ? myDie : oppDie);
    const readyOf    = (s) => duel.players[s]?.ready ?? 0;
    const nameOf     = (s) => duel.players[s]?.user || '';
    const throwOf    = (r, s) => duel.rounds[r]?.[s] || null;
    const landedOn   = (r, s) => duel.playback[`${r}:${s}`] === 'landed';
    const currentRound = () => Math.max(...SLOTS.map(readyOf));
    const roundOpen  = (r) => r >= 1 && !!duel.players.p2 && SLOTS.every(s => readyOf(s) >= r);
    const hasPlayed  = () => Object.keys(duel.rounds).length > 0;

    // What the duel is doing right now
    function duelPhase() {
      if (duel.problem) return 'problem';
      if (!duel.players.p2) return 'waiting';
      const r = currentRound();
      if (!roundOpen(r)) return 'lobby';
      if (SLOTS.every(s => throwOf(r, s) && landedOn(r, s))) return 'result';
      return 'rolling';
    }

    // 'p1', 'p2' or 'tie' for a round where both have thrown
    function winnerOf(r) {
      const a = throwOf(r, 'p1').value, b = throwOf(r, 'p2').value;
      return a === b ? 'tie' : a > b ? 'p1' : 'p2';
    }
    const isShrollOff = (r) => r > 1 && !!throwOf(r - 1, 'p1') && !!throwOf(r - 1, 'p2') && winnerOf(r - 1) === 'tie';

    const canDuelRoll = () => !!duel.me && duelPhase() === 'rolling' && !throwOf(currentRound(), duel.me);
    const canTapReady = () => {
      if (!duel.me) return false;
      const phase = duelPhase();
      if (phase === 'result') return winnerOf(currentRound()) !== 'tie';
      return (phase === 'waiting' || phase === 'lobby') && readyOf(duel.me) < Math.max(currentRound(), 1);
    };

    // ---------- Duel data cleaning (the database is shared, so trust nothing) ----------
    function cleanPlayer(raw) {
      if (!raw || typeof raw !== 'object' || typeof raw.user !== 'string' || !raw.user.trim()) return null;
      const ready = Number(raw.ready);
      return { user: raw.user.trim().slice(0, 40), ready: Number.isInteger(ready) && ready >= 0 ? ready : 0 };
    }

    function cleanThrow(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const value = Number(raw.value), time = Number(raw.time);
      if (!Number.isInteger(value) || value < 1 || value > 6 || !Number.isFinite(time)) return null;
      const juggles = Object.entries(raw.juggles || {})
        .map(([key, ms]) => ({ key, ms: Number(ms) }))
        .filter(j => Number.isFinite(j.ms) && j.ms >= 0 && j.ms < JUGGLE_WINDOW)
        .sort((a, b) => a.ms - b.ms);
      return {
        value, time, juggles,
        dir: Number(raw.dir) < 0 ? -1 : 1,
        strength: clamp(Number(raw.strength) || 1, 0.5, 1.6)
      };
    }

    // Firebase may hand back numbered children as an array, so read entries either way
    function cleanSession(raw) {
      const players = {}, rounds = {};
      for (const s of SLOTS) { const p = cleanPlayer(raw.players?.[s]); if (p) players[s] = p; }
      for (const [n, round] of Object.entries(raw.rounds || {})) {
        if (!/^\d{1,3}$/.test(n) || !round) continue;
        const entry = {};
        for (const s of SLOTS) { const t = cleanThrow(round[s]); if (t) entry[s] = t; }
        if (Object.keys(entry).length) rounds[Number(n)] = entry;
      }
      return { players, rounds };
    }

    // Which seat this tab holds in a duel (survives reloads, not shared across tabs)
    const seatKey = (id) => `shrekDuelSeat:${id}`;
    const recallSeat = (id) => { try { return sessionStorage.getItem(seatKey(id)); } catch { return null; } };
    const rememberSeat = (id, s) => { try { sessionStorage.setItem(seatKey(id), s); } catch {} };

    const duelIdFromHash = () => (location.hash.match(/^#duel-([-\w]{10,40})$/) || [])[1] || null;

    // ---------- Duel logic ----------
    const duelDb = (path = '') => db.ref(`sessions/${duel.id}${path ? '/' + path : ''}`);
    const TIMESTAMP = () => firebase.database.ServerValue.TIMESTAMP;

    function duelWriteFailed(err) {
      console.warn('Duel write failed:', err?.message);
      duel.problem = 'rejected';
      renderDuel();
    }

    // Starts a new duel with me as player 1
    function createDuel() {
      if (!db) return;
      const ref = db.ref('sessions').push();      // unguessable key, made on this device
      rememberSeat(ref.key, 'p1');
      history.replaceState(null, '', `#duel-${ref.key}`);
      duel.creating = true;
      enterDuel(ref.key);
      ref.update({ created: TIMESTAMP(), 'players/p1/user': userId, 'players/p1/ready': 0 })
        .then(() => { duel.creating = false; })
        .catch(duelWriteFailed);
    }

    // Opens a duel by id and listens for everything that happens in it
    function enterDuel(id) {
      duel.id = id;
      duel.me = recallSeat(id);
      if (!db) duel.problem = 'offline';
      else {
        duelRef = duelDb();
        duelRef.on('value', onSessionData, (err) => {
          console.warn('Duel closed:', err?.message);
          duel.problem = 'unavailable';
          renderDuel();
        });
      }
      applyStageMode();
      renderDuel();
    }

    function leaveDuel() {
      duelRef?.off();
      duelRef = null;
      clearTimeout(tieTimer);
      Object.assign(duel, freshDuel());
      history.replaceState(null, '', location.pathname + location.search);
      result.textContent = '';
      result.className = '';
      applyStageMode();
      renderDuel();
    }

    function onSessionData(snap) {
      const raw = snap.val();
      if (!raw) {
        if (!duel.creating) duel.problem = 'missing';
        renderDuel();
        return;
      }
      if (duel.problem !== 'rejected') duel.problem = '';
      Object.assign(duel, cleanSession(raw));
      if (!duel.me && !duel.joining) claimSeat();
      syncPlayback();
      onDuelProgress();
    }

    // Takes the empty player-2 seat; if someone beats us to it, we watch instead
    async function claimSeat() {
      if (duel.players.p2 || !duel.players.p1) return;
      duel.joining = true;
      try {
        await duelDb().update({ 'players/p2/user': userId, 'players/p2/ready': 0 });
        duel.me = 'p2';
        rememberSeat(duel.id, 'p2');
      } catch {
        // seat taken: stay a spectator
      }
      duel.joining = false;
      applyStageMode();
      renderDuel();
    }

    // Moves my "ready" up to round n (rules only allow +1 steps)
    function setReady(n) {
      if (!duel.me || readyOf(duel.me) !== n - 1) return;
      duelDb(`players/${duel.me}/ready`).set(n).catch(duelWriteFailed);
    }

    // Sends my throw for the current round; returns hooks for juggles and landing
    function beginDuelThrow(value, dir, strength) {
      const r = currentRound(), key = `${r}:${duel.me}`;
      const ref = duelDb(`rounds/${r}/${duel.me}`);
      duel.playback[key] = 'flying';
      duel.thrownHere[r] = true;
      ref.set({ value, dir, strength: Math.round(strength * 1000) / 1000, time: TIMESTAMP() })
        .catch(duelWriteFailed);
      renderDuel();
      return {
        juggle: (ms) => { ref.child('juggles').push(Math.round(ms)).catch(() => {}); },
        landed: () => { duel.playback[key] = 'landed'; onDuelProgress(); }
      };
    }

    // Makes each die show its player's throw for the current round
    function syncPlayback() {
      const r = currentRound();
      if (!roundOpen(r)) return;
      for (const s of SLOTS) {
        const t = throwOf(r, s), key = `${r}:${s}`;
        if (!t) continue;
        if (!duel.playback[key]) {
          if (s === duel.me) {                       // my own throw, from before a reload
            dieFor(s).snap(faceOf(t.value));
            duel.playback[key] = 'landed';
          } else {
            startReplay(r, s, t);
          }
        } else if (replays[key]) {
          scheduleJuggles(key, t);
        }
      }
    }

    // Replays someone's throw on their die, slightly behind real time
    function startReplay(r, s, t) {
      const key = `${r}:${s}`;
      const die = dieFor(s);
      const instant = serverNow() - t.time > STALE_MS || die.rolling;
      const rep = { start: performance.now() + (instant ? 0 : REPLAY_DELAY), die, instant, done: new Set() };
      replays[key] = rep;
      duel.playback[key] = 'flying';
      setTimeout(async () => {
        await throwDie(die, { dir: t.dir, strength: t.strength, target: faceOf(t.value), replay: true, instant });
        delete replays[key];
        duel.playback[key] = 'landed';
        onDuelProgress();
      }, rep.start - performance.now());
      scheduleJuggles(key, t);
    }

    // Queues each juggle tap at the same moment it happened in the original throw
    function scheduleJuggles(key, t) {
      const rep = replays[key];
      if (!rep || rep.instant) return;
      for (const j of t.juggles) {
        if (rep.done.has(j.key)) continue;
        rep.done.add(j.key);
        setTimeout(() => rep.die.juggle?.(), Math.max(0, rep.start + j.ms - performance.now()));
      }
    }

    // After any change: clear the old call-out when a new round starts, announce a
    // finished round once, and roll a tie straight into a shroll-off
    function onDuelProgress() {
      const r = currentRound();
      if (r !== duel.round) {
        if (duel.round) clearResultLine();
        duel.round = r;
      }
      if (duelPhase() === 'result' && duel.announced !== r) {
        duel.announced = r;
        const w = winnerOf(r);
        showOutcome(w);
        if (w === duel.me && duel.thrownHere[r]) postDuelResult(r);
        if (w === 'tie' && duel.me) {
          clearTimeout(tieTimer);
          tieTimer = setTimeout(() => setReady(r + 1), 1800);
        }
      }
      renderDuel();
    }

    // The winner's screen posts the round to the shared list (ties never do)
    function postDuelResult(r) {
      const loser = other(duel.me);
      postToFeed({
        kind: 'duel',
        user: nameOf(duel.me) || userId,
        value: throwOf(r, duel.me).value,
        vs: nameOf(loser) || 'Someone',
        vsValue: throwOf(r, loser).value
      });
    }

    function showDuelNote(text) {
      duel.note = text;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { duel.note = ''; renderDuel(); }, 2500);
      renderDuel();
    }

    // Phone share sheet if there is one, else copy the link
    async function shareDuel() {
      const url = location.href;
      if (navigator.share) {
        try { await navigator.share({ title: 'Shrek Dice duel', text: 'Shroll me, ogre.', url }); return; }
        catch (err) { if (err?.name === 'AbortError') return; }
      }
      try {
        await navigator.clipboard.writeText(url);
        showDuelNote('Link copied. Send it to a friend.');
      } catch {
        window.prompt('Copy this duel link:', url);
      }
    }

    // Tapping my die when it isn't my turn points at the duel box instead
    function nudgeDuel() {
      flash(duelStatus, 'bump');
      vibrate(8);
    }

    // ---------- Duel rendering ----------
    // Solo: one full-width lane. Duel: two smaller lanes with labels.
    function applyStageMode() {
      const on = inDuel();
      diceStage.classList.toggle('duel', on);
      laneRight.hidden = !on;
      for (const lane of [laneLeft, laneRight]) lane.querySelector('.lane-label').hidden = !on;
      rollHint.hidden = on;
      for (const die of [myDie, oppDie]) { die.measure(); die.render(0, 0, 0, 0, die.rotX, die.rotY, 0); }
      const watching = on && !duel.me;
      myBox.setAttribute('aria-label', watching ? `${nameOf('p1') || 'Player 1'}'s die` : 'Roll the Shrek die');
    }

    const PROBLEM_TEXT = {
      offline:     'Duels need the swamp connection. Shrolling solo for now.',
      missing:     'That duel link has gone stale.',
      unavailable: "Couldn't reach the duel.",
      rejected:    "The swamp didn't accept that. Try a new duel."
    };

    // Words under the duel box for the current phase
    function duelStatusText() {
      if (duel.note) return duel.note;
      const phase = duelPhase(), r = currentRound();
      const opp = duel.me ? nameOf(other(duel.me)) : '';
      switch (phase) {
        case 'problem': return PROBLEM_TEXT[duel.problem];
        case 'waiting':
          if (!duel.me) return 'Waiting for a second shrekker.';
          return readyOf(duel.me) >= 1 ? "You're ready. Send the link to a friend." : 'Send the link to a friend, then tap Ready.';
        case 'lobby':
          if (!duel.me) return 'Waiting for both shrekkers to get ready.';
          if (readyOf(duel.me) < Math.max(r, 1)) return readyOf(other(duel.me)) >= Math.max(r, 1)
            ? `${opp} is ready${hasPlayed() ? ' for a rematch' : ''}. Are you?`
            : `Tap ${hasPlayed() ? 'Rematch' : 'Ready'} when you are.`;
          return `Waiting for ${opp}…`;
        case 'rolling':
          if (!duel.me) return isShrollOff(r) ? 'SHROLL-OFF!' : 'Shrolling…';
          if (!throwOf(r, duel.me)) return isShrollOff(r) ? 'SHROLL-OFF! Your shroll.' : 'Your shroll! Tap, flick or juggle.';
          return throwOf(r, other(duel.me)) ? 'Landing…' : `Waiting for ${opp} to shroll…`;
        case 'result': {
          const w = winnerOf(r);
          if (w === 'tie') return 'Tie! Sudden-death shroll-off coming up…';
          if (!duel.me) return `${nameOf(w)} wins.`;
          return w === duel.me ? 'You out-shrekked them. Rematch?' : `${opp} wins this one. Rematch?`;
        }
      }
      return '';
    }

    // Name + state under one lane's die
    function renderLaneLabel(lane, s) {
      const label = lane.querySelector('.lane-label');
      const r = currentRound(), t = roundOpen(r) ? throwOf(r, s) : null;
      const phase = duelPhase();
      let state;
      if (!duel.players[s]) state = 'not here yet';
      else if (t && landedOn(r, s)) state = plural(t.value);
      else if (t) state = 'shrolling…';
      else if (phase === 'rolling') state = 'up to shroll';
      else state = readyOf(s) >= Math.max(r, 1) ? 'ready' : 'not ready';

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = s === duel.me ? 'You' : (nameOf(s) || 'Waiting for a friend…');
      const st = document.createElement('span');
      st.className = 'state';
      st.textContent = state;
      label.replaceChildren(name, st);
      label.classList.toggle('win', phase === 'result' && winnerOf(r) === s);
    }

    function renderDuel() {
      const on = inDuel();
      duelBtn.hidden = on;
      duelBtn.disabled = !db;
      duelBtn.title = db ? '' : 'Duels need the swamp connection';
      duelInfo.hidden = !on;
      if (!on) return;

      const me = duel.me;
      duelVs.textContent = me
        ? `You vs ${nameOf(other(me)) || '…'}`
        : `${nameOf('p1') || '…'} vs ${nameOf('p2') || '…'} (watching)`;
      duelStatus.textContent = duelStatusText();

      const showAction = canTapReady();
      duelAction.hidden = !showAction;
      duelAction.textContent = hasPlayed() ? 'Rematch' : 'Ready';
      duelShare.hidden = duel.problem === 'missing';

      renderLaneLabel(laneLeft, leftSlot());
      renderLaneLabel(laneRight, other(leftSlot()));
    }

    function clearResultLine() {
      result.textContent = '';
      result.className = '';
    }

    // Big call-out in the result line when a round is decided
    function showOutcome(w) {
      result.className = '';
      void result.offsetWidth;
      if (w === 'tie') {
        result.textContent = 'SHROLL-OFF!';
        result.classList.add('pop');
        return;
      }
      bubbles(dieFor(w), 24, 0, true);
      if (!duel.me) {
        result.textContent = `${nameOf(w)} WINS!`;
        result.classList.add('pop');
      } else if (w === duel.me) {
        result.textContent = 'YOU WIN!';
        result.classList.add('pop', 'max');
        vibrate([30, 60, 30, 60, 30]);
      } else {
        result.textContent = 'OUT-SHREKKED!';
        result.classList.add('min');
      }
    }

    duelBtn.addEventListener('click', () => { initAudio(); createDuel(); shareDuel(); });
    duelAction.addEventListener('click', () => {
      initAudio();
      if (canTapReady()) setReady(readyOf(duel.me) + 1);
    });
    duelShare.addEventListener('click', shareDuel);
    duelLeave.addEventListener('click', leaveDuel);
    // Opening a different duel link in this tab starts fresh
    addEventListener('hashchange', () => { if (duelIdFromHash() !== duel.id) location.reload(); });

    // ---------- Input: tap, hold-to-shake, flick-to-throw ----------
    let hold = null;

    // Mid-roll taps anywhere on my die or its floor keep it in the air
    laneLeft.addEventListener('pointerdown', (e) => {
      if (!myDie.juggle || myDie.replaying || (e.button !== undefined && e.button !== 0)) return;
      e.preventDefault();
      myDie.juggle();
    });

    myBox.addEventListener('pointerdown', (e) => {
      if (myDie.rolling || (e.button !== undefined && e.button !== 0)) return;
      if (inDuel() && !canDuelRoll()) { nudgeDuel(); return; }
      initAudio();
      myBox.setPointerCapture?.(e.pointerId);
      hold = { id: e.pointerId, t0: performance.now(), samples: [{ x: e.clientX, t: e.timeStamp }], rattle: null, shaking: false };
      // Start shaking only if they keep holding (a quick tap shouldn't rattle)
      hold.timer = setTimeout(() => {
        if (!hold) return;
        hold.shaking = true;
        myBox.classList.add('holding');
        hold.rattle = setInterval(() => clack(0.08 + Math.random() * 0.08, 0.8 + Math.random() * 0.6), 95);
      }, 160);
    });

    myBox.addEventListener('pointermove', (e) => {
      if (!hold || e.pointerId !== hold.id) return;
      hold.samples.push({ x: e.clientX, t: e.timeStamp });
      while (hold.samples.length > 2 && e.timeStamp - hold.samples[0].t > 100) hold.samples.shift();
    });

    function endHold() {
      if (!hold) return null;
      clearTimeout(hold.timer);
      clearInterval(hold.rattle);
      myBox.classList.remove('holding');
      const h = hold;
      hold = null;
      return h;
    }

    myBox.addEventListener('pointerup', (e) => {
      const h = endHold();
      if (!h || e.pointerId !== h.id) return;
      const s = h.samples, a = s[0], b = s[s.length - 1];
      const vx = b.t > a.t ? (b.x - a.x) / (b.t - a.t) : 0;   // px per ms
      const held = performance.now() - h.t0;
      const flicked = Math.abs(vx) > 0.25;
      roll({
        dir: flicked ? Math.sign(vx) : undefined,
        strength: 0.8 + (flicked ? Math.min(Math.abs(vx) * 0.35, 0.5) : 0) + (h.shaking ? Math.min(held / 2500, 0.3) : 0)
      });
    });

    myBox.addEventListener('pointercancel', endHold);
    myBox.addEventListener('lostpointercapture', () => { if (hold) endHold(); });

    // Enter/Space rolls, or juggles while my die is in the air
    const rollOrJuggle = () => (myDie.juggle && !myDie.replaying ? myDie.juggle() : roll());
    myBox.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      if (!e.repeat) rollOrJuggle();               // holding a key shouldn't spam juggles
    });
    document.addEventListener('keydown', (e) => {
      if (e.key !== ' ' || e.repeat) return;
      const tag = (document.activeElement?.tagName || '').toLowerCase();
      if (['select', 'button', 'input', 'textarea'].includes(tag) || document.activeElement === myBox) return;
      e.preventDefault();
      rollOrJuggle();
    });

    // ---------- Start ----------
    updateUsername();
    const linkedDuel = duelIdFromHash();
    if (linkedDuel) enterDuel(linkedDuel);
    else renderDuel();
  </script>
</body>
</html>
