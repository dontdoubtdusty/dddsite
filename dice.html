<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shrek Dice</title>
  <style>
    :root {
      --lime: #7cfc00;
      --swamp-dark: rgba(13, 31, 13, 0.92);
      --die-size: 150px;
      --half: 75px;
    }

    * { box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 80px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 90px 16px 24px;
      background: #000 url('shreks-swamp.png') center / cover no-repeat;
      position: relative;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(45, 74, 43, 0.85) 0%, rgba(26, 46, 26, 0.85) 30%, rgba(13, 31, 13, 0.85) 60%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 0;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    /* ---------- Username bar ---------- */
    #username-picker {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      align-items: center;
      background: var(--swamp-dark);
      padding: 12px 20px;
      border-radius: 10px;
      border: 2px solid var(--lime);
      box-shadow: 0 0 15px rgba(124, 252, 0, 0.3);
      max-width: calc(100vw - 32px);
    }

    #username-picker label {
      color: var(--lime);
      font-family: 'Arial Black', sans-serif;
      font-size: 14px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }

    #username-picker select,
    #username-picker button {
      background: rgba(0, 0, 0, 0.5);
      color: var(--lime);
      border: 2px solid var(--lime);
      border-radius: 5px;
      padding: 5px 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      cursor: pointer;
    }

    #username-picker select:focus-visible,
    #username-picker button:focus-visible {
      outline: none;
      box-shadow: 0 0 10px rgba(124, 252, 0, 0.6);
    }

    #username-picker select option { background: #0d1f0d; }

    #user-tag {
      color: #c8ff9a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    /* ---------- Die ---------- */
    #dice-stage {
      position: relative;
      width: var(--die-size);
      height: var(--die-size);
      flex-shrink: 0;
    }

    #dice-container {
      width: 100%;
      height: 100%;
      perspective: 800px;
      cursor: pointer;
      border-radius: 12px;
      outline: none;
    }

    #dice-container:focus-visible #cube .face {
      border-color: var(--lime);
    }

    #dice-container[aria-disabled="true"] { cursor: progress; }

    /* Shadow stays on the ground while the die is tossed */
    #dice-shadow {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 20px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0.8;
      pointer-events: none;
    }

    #dice-container.tossing { animation: diceToss 1.8s ease-in-out; }
    #dice-shadow.tossing   { animation: shadowShrink 1.8s ease-in-out; }

    @keyframes diceToss {
      0%   { transform: translateY(0) scale(1); }
      25%  { transform: translateY(-80px) scale(1.1); }
      50%  { transform: translateY(-100px) scale(1.15); }
      75%  { transform: translateY(-60px) scale(1.05); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes shadowShrink {
      0%   { width: 120px; opacity: 0.8; }
      25%  { width: 60px;  opacity: 0.35; }
      50%  { width: 40px;  opacity: 0.2; }
      75%  { width: 80px;  opacity: 0.5; }
      100% { width: 120px; opacity: 0.8; }
    }

    #cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1s;
    }

    .face {
      position: absolute;
      width: var(--die-size);
      height: var(--die-size);
      border: 2px solid #a0a0a0;
      display: grid;
      padding: 8px;
      gap: 3px;
      background: #689f38;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.25);
      transition: box-shadow 0.2s;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .face.one   { grid-template: 1fr / 1fr; place-items: center; }
    .face.two,
    .face.three,
    .face.five  { grid-template: repeat(3, 1fr) / repeat(3, 1fr); }
    .face.four  { grid-template: 1fr 1fr / 1fr 1fr; }
    .face.six   { grid-template: repeat(2, 1fr) / repeat(3, 1fr); }

    .front  { transform: rotateY(0deg)   translateZ(var(--half)); }
    .back   { transform: rotateY(180deg) translateZ(var(--half)); }
    .right  { transform: rotateY(90deg)  translateZ(var(--half)); }
    .left   { transform: rotateY(-90deg) translateZ(var(--half)); }
    .top    { transform: rotateX(90deg)  translateZ(var(--half)); }
    .bottom { transform: rotateX(-90deg) translateZ(var(--half)); }

    .tint-red img    { filter: sepia(100%) saturate(500%) hue-rotate(-50deg) brightness(0.8); }
    .tint-blue img   { filter: sepia(100%) saturate(500%) hue-rotate(180deg) brightness(0.9); }
    .tint-green img  { filter: sepia(100%) saturate(500%) hue-rotate(60deg)  brightness(1); }
    .tint-purple img { filter: sepia(100%) saturate(500%) hue-rotate(260deg) brightness(0.9); }
    .tint-orange img { filter: sepia(100%) saturate(500%) hue-rotate(10deg)  brightness(1.1); }
    .tint-pink img   { filter: sepia(100%) saturate(300%) hue-rotate(300deg) brightness(1.2); }

    @keyframes shake {
      0%   { transform: translate(0, 0) rotateZ(0deg); }
      10%  { transform: translate(-4px, 2px) rotateZ(-2deg); }
      20%  { transform: translate(3px, -3px) rotateZ(1deg); }
      30%  { transform: translate(-2px, 4px) rotateZ(-2deg); }
      40%  { transform: translate(4px, -2px) rotateZ(2deg); }
      50%  { transform: translate(-3px, -3px) rotateZ(-1deg); }
      60%  { transform: translate(2px, 3px) rotateZ(2deg); }
      70%  { transform: translate(-3px, -2px) rotateZ(-1deg); }
      80%  { transform: translate(2px, 3px) rotateZ(1deg); }
      90%  { transform: translate(-1px, -2px) rotateZ(-1deg); }
      100% { transform: translate(0, 0) rotateZ(0deg); }
    }

    .shaking { animation: shake 0.3s ease; }

    #roll-hint {
      position: absolute;
      top: calc(100% + 44px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      color: rgba(200, 255, 154, 0.75);
      font-size: 13px;
      letter-spacing: 0.5px;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .particle {
      position: absolute;
      width: 20px;
      height: 20px;
      background: radial-gradient(circle, #90ff00 0%, #7cfc00 30%, #228b22 100%);
      border-radius: 50%;
      pointer-events: none;
      animation: float-up 2s ease-out forwards;
      opacity: 0.8;
      box-shadow: inset -3px -3px 8px rgba(0, 0, 0, 0.3),
                  inset 3px 3px 8px rgba(255, 255, 255, 0.4),
                  0 0 10px rgba(124, 252, 0, 0.5);
      z-index: 2;
    }

    @keyframes float-up {
      0%   { transform: translate(0, 0) scale(1); opacity: 0.7; }
      100% { transform: translate(var(--drift), -200px) scale(0); opacity: 0; }
    }

    /* ---------- Rolls panel ---------- */
    #rolls-panel {
      background: var(--swamp-dark);
      border: 3px solid var(--lime);
      border-radius: 15px;
      padding: 20px;
      width: 300px;
      max-width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 20px rgba(124, 252, 0, 0.3);
    }

    #rolls-panel h2 {
      color: var(--lime);
      font-family: 'Arial Black', sans-serif;
      text-align: center;
      margin: 0 0 15px;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #current-result {
      color: var(--lime);
      font-size: 28px;
      font-weight: bold;
      font-family: 'Arial Black', sans-serif;
      text-align: center;
      margin-bottom: 20px;
      min-height: 35px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    #current-result.pop { animation: pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1); }
    #current-result.max { color: #ffe14d; text-shadow: 0 0 12px rgba(255, 225, 77, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.8); }
    #current-result.min { color: #ff8a65; }

    @keyframes pop {
      0%   { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    #rolls-list {
      list-style: none;
      margin: 0;
      padding: 0;
      color: var(--lime);
      font-size: 15px;
    }

    #rolls-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 5px;
      border-left: 3px solid var(--lime);
    }

    #rolls-list li.mine {
      background: rgba(124, 252, 0, 0.12);
      border-left-color: #ffe14d;
    }

    #rolls-list li.fresh { animation: slideIn 0.4s ease-out; }

    @keyframes slideIn {
      from { transform: translateX(-12px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    #rolls-list .who {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.35;
    }

    #rolls-list .who b { color: #c8ff9a; }
    #rolls-list .ago {
      flex-shrink: 0;
      font-size: 12px;
      color: rgba(124, 252, 0, 0.65);
    }

    #rolls-list .empty {
      border: 0;
      background: none;
      justify-content: center;
      color: rgba(124, 252, 0, 0.6);
      font-style: italic;
    }

    #my-stats {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed rgba(124, 252, 0, 0.4);
      color: rgba(200, 255, 154, 0.85);
      font-size: 13px;
      text-align: center;
      min-height: 1em;
    }

    #status-note {
      margin-top: 8px;
      color: #ffb74d;
      font-size: 12px;
      text-align: center;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* ---------- Small screens ---------- */
    @media (max-width: 760px) {
      body {
        flex-direction: column;
        justify-content: flex-start;
        gap: 110px;
        padding-top: 24px;
      }
      #username-picker {
        position: relative;
        top: auto;
        left: auto;
        transform: none;
        width: 100%;
        max-width: 420px;
        margin-bottom: -40px;
      }
      #dice-stage { margin-top: 100px; }
      #rolls-panel { max-height: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #dice-container.tossing,
      #dice-shadow.tossing,
      .shaking,
      #current-result.pop,
      #rolls-list li.fresh { animation: none; }
      .particle { display: none; }
    }
  </style>
</head>
<body>
  <div id="username-picker">
    <label for="adjective-select">Username:</label>
    <select id="adjective-select" aria-label="Adjective">
      <option>Lucky</option><option>Unlucky</option><option>Blessed</option><option>Cursed</option>
      <option>Risky</option><option>Golden</option><option>Swampy</option><option>Ogre</option>
      <option>Onion</option><option>Layered</option><option>Muddy</option><option>Stinky</option>
      <option>Crusty</option><option>Saucy</option><option>Enchanted</option><option>Wicked</option>
      <option>Royal</option><option>Swollen</option><option>Soft</option><option>Magic</option>
      <option>Dirty</option><option>Sloppy</option>
    </select>
    <select id="character-select" aria-label="Character">
      <option>Shrek</option><option>Fiona</option><option>Donkey</option><option>Puss</option>
      <option>Farquaad</option><option>Dragon</option><option>Gingy</option><option>Pinocchio</option>
      <option>BigBadWolf</option><option>ThreePigs</option><option>BlindMice</option><option>Boots</option>
      <option>Cookie</option><option>Tail</option><option>Swamp</option><option>Castle</option>
      <option>Onion</option><option>Parfait</option><option>Muffin</option><option>Waffles</option>
      <option>Throne</option><option>Wand</option><option>Potion</option><option>Godmother</option>
      <option>Mirror</option><option>Outhouse</option>
    </select>
    <span id="user-tag" title="This is how you'll appear in the roll list"></span>
    <button id="mute-btn" type="button" aria-pressed="false" title="Toggle sound">🔊</button>
  </div>

  <div id="dice-stage">
    <div id="dice-container" role="button" tabindex="0" aria-label="Roll the Shrek die">
      <div id="cube">
        <div class="face front one">
          <img src="shrek_PNG.png" alt="">
        </div>
        <div class="face back six">
          <img src="shrek_PNG.png" alt=""><img src="shrek_PNG.png" alt=""><img src="shrek_PNG.png" alt="">
          <img src="shrek_PNG.png" alt=""><img src="shrek_PNG.png" alt=""><img src="shrek_PNG.png" alt="">
        </div>
        <div class="face right three">
          <img src="shrek_PNG.png" alt=""><div></div><div></div>
          <div></div><img src="shrek_PNG.png" alt=""><div></div>
          <div></div><div></div><img src="shrek_PNG.png" alt="">
        </div>
        <div class="face left four">
          <img src="shrek_PNG.png" alt=""><img src="shrek_PNG.png" alt="">
          <img src="shrek_PNG.png" alt=""><img src="shrek_PNG.png" alt="">
        </div>
        <div class="face top five">
          <img src="shrek_PNG.png" alt=""><div></div><img src="shrek_PNG.png" alt="">
          <div></div><img src="shrek_PNG.png" alt=""><div></div>
          <img src="shrek_PNG.png" alt=""><div></div><img src="shrek_PNG.png" alt="">
        </div>
        <div class="face bottom two">
          <img src="shrek_PNG.png" alt=""><div></div><div></div>
          <div></div><div></div><div></div>
          <div></div><div></div><img src="shrek_PNG.png" alt="">
        </div>
      </div>
    </div>
    <div id="dice-shadow"></div>
    <div id="roll-hint">click, tap or press space to shroll</div>
  </div>

  <div id="rolls-panel">
    <h2>LAST 6 SHROLLS</h2>
    <div id="current-result" aria-live="polite"></div>
    <ul id="rolls-list"></ul>
    <div id="my-stats"></div>
    <div id="status-note" hidden></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const cube          = $('cube');
    const result        = $('current-result');
    const diceContainer = $('dice-container');
    const diceStage     = $('dice-stage');
    const diceShadow    = $('dice-shadow');
    const rollsList     = $('rolls-list');
    const adjSelect     = $('adjective-select');
    const charSelect    = $('character-select');
    const userTag       = $('user-tag');
    const muteBtn       = $('mute-btn');
    const myStats       = $('my-stats');
    const statusNote    = $('status-note');
    const rollHint      = $('roll-hint');

    const MAX_SHOWN = 6;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---------- Small safe localStorage wrapper ----------
    const store = {
      get(key, fallback) {
        try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
        catch { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage blocked */ }
      }
    };

    const randInt = (n) => {
      if (window.crypto && crypto.getRandomValues) {
        // Rejection sampling for an unbiased result
        const buf = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / n) * n;
        do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
        return buf[0] % n;
      }
      return Math.floor(Math.random() * n);
    };

    // ---------- Username (persists across visits) ----------
    const saved = store.get('shrekDiceUser', null);
    if (saved && typeof saved.number === 'number') {
      adjSelect.selectedIndex  = Math.min(saved.adj  ?? 0, adjSelect.options.length - 1);
      charSelect.selectedIndex = Math.min(saved.char ?? 0, charSelect.options.length - 1);
    } else {
      adjSelect.selectedIndex  = randInt(adjSelect.options.length);
      charSelect.selectedIndex = randInt(charSelect.options.length);
    }
    const userNumber = saved && typeof saved.number === 'number' ? saved.number : randInt(100);

    let userId = '';
    function updateUsername() {
      userId = `${adjSelect.value}${charSelect.value}${userNumber}`;
      userTag.textContent = userId;
      store.set('shrekDiceUser', {
        adj: adjSelect.selectedIndex,
        char: charSelect.selectedIndex,
        number: userNumber
      });
      renderRolls();
    }
    adjSelect.addEventListener('change', updateUsername);
    charSelect.addEventListener('change', updateUsername);

    // ---------- Sound ----------
    const sounds = { some: new Audio('SOME.wav'), body: new Audio('BODY.wav') };
    Object.values(sounds).forEach(a => { a.preload = 'auto'; });
    let muted = store.get('shrekDiceMuted', false);

    function syncMute() {
      muteBtn.textContent = muted ? '🔇' : '🔊';
      muteBtn.setAttribute('aria-pressed', String(muted));
      muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    }
    muteBtn.addEventListener('click', () => {
      muted = !muted;
      store.set('shrekDiceMuted', muted);
      syncMute();
    });
    syncMute();

    function play(name) {
      if (muted) return;
      const a = sounds[name];
      try { a.currentTime = 0; } catch { /* not loaded yet */ }
      a.play().catch(() => {});
    }

    // ---------- Random face colors ----------
    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    const colors = shuffle(['tint-red', 'tint-blue', 'tint-green', 'tint-purple', 'tint-orange', 'tint-pink']);
    document.querySelectorAll('#cube .face').forEach((face, i) => face.classList.add(colors[i]));

    // ---------- Roll history ----------
    let allRolls = [];       // [{ key, value, time, user }]
    let lastNewestKey = null;
    let online = false;

    function timeAgo(t) {
      const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
      if (s < 5)     return 'just now';
      if (s < 60)    return `${s}s ago`;
      if (s < 3600)  return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    const plural = (v) => `${v} SHREK${v === 1 ? '' : 'S'}`;

    // Builds the list with DOM nodes + textContent so usernames from the
    // shared database can never inject HTML or scripts into the page.
    function renderRolls() {
      const shown = allRolls.slice(-MAX_SHOWN).reverse();
      const newestKey = shown[0]?.key ?? null;
      const isNew = lastNewestKey !== null && newestKey !== lastNewestKey;
      lastNewestKey = newestKey;

      rollsList.replaceChildren();

      if (!shown.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'No shrolls yet. Be the first!';
        rollsList.append(li);
        return;
      }

      shown.forEach((roll, i) => {
        const li = document.createElement('li');
        if (roll.user === userId) li.classList.add('mine');
        if (i === 0 && isNew) li.classList.add('fresh');

        const who = document.createElement('span');
        who.className = 'who';
        who.title = `${roll.user} rolled ${plural(roll.value)}`;
        const name = document.createElement('b');
        name.textContent = roll.user;
        who.append(name, ` rolled ${plural(roll.value)}`);

        const ago = document.createElement('span');
        ago.className = 'ago';
        ago.dataset.time = roll.time;
        ago.textContent = timeAgo(roll.time);

        li.append(who, ago);
        rollsList.append(li);
      });
    }

    // Keep "x ago" labels fresh without rebuilding the list
    setInterval(() => {
      rollsList.querySelectorAll('.ago').forEach(el => {
        el.textContent = timeAgo(Number(el.dataset.time));
      });
    }, 1000);

    // Only accept well-formed rolls from the shared database
    function cleanRoll(key, raw) {
      if (!raw || typeof raw !== 'object') return null;
      const value = Number(raw.value);
      const time  = Number(raw.time);
      if (!Number.isInteger(value) || value < 1 || value > 6) return null;
      if (!Number.isFinite(time)) return null;
      const user = typeof raw.user === 'string' && raw.user.trim()
        ? raw.user.trim().slice(0, 40)
        : 'Someone';
      return { key, value, time: Math.min(time, Date.now()), user };
    }

    // Personal stats for this device
    let myRolls = store.get('shrekDiceMyRolls', []);
    if (!Array.isArray(myRolls)) myRolls = [];

    function renderStats() {
      if (!myRolls.length) { myStats.textContent = ''; return; }
      const total = myRolls.reduce((a, b) => a + b, 0);
      const avg = (total / myRolls.length).toFixed(2);
      const sixes = myRolls.filter(v => v === 6).length;
      myStats.textContent =
        `Your shrolls: ${myRolls.length} · avg ${avg} · max shreks ${sixes}×`;
    }
    renderStats();

    // ---------- Firebase (falls back to local-only if it can't load) ----------
    let db = null;
    try {
      firebase.initializeApp({ databaseURL: 'https://shrek-dice-default-rtdb.firebaseio.com/' });
      db = firebase.database();
      db.ref('rolls').limitToLast(10).on('value', (snapshot) => {
        online = true;
        statusNote.hidden = true;
        const next = [];
        snapshot.forEach(child => {
          const r = cleanRoll(child.key, child.val());
          if (r) next.push(r);
        });
        next.sort((a, b) => a.time - b.time);
        allRolls = next;
        renderRolls();
      }, () => goOffline());
      db.ref('.info/connected').on('value', snap => {
        if (snap.val() === false && online) {
          statusNote.textContent = 'Reconnecting to the swamp…';
          statusNote.hidden = false;
        } else if (snap.val() === true) {
          statusNote.hidden = true;
        }
      });
    } catch (e) {
      goOffline();
    }

    function goOffline() {
      db = null;
      online = false;
      statusNote.textContent = 'Shared roll list unavailable — showing your rolls only.';
      statusNote.hidden = false;
      renderRolls();
    }

    function saveRoll(value) {
      const roll = { value, time: Date.now(), user: userId };
      myRolls.push(value);
      if (myRolls.length > 500) myRolls = myRolls.slice(-500);
      store.set('shrekDiceMyRolls', myRolls);
      renderStats();

      if (db) {
        db.ref('rolls').push(roll).catch(() => goOffline());
      } else {
        allRolls.push({ key: 'local-' + roll.time, ...roll });
        renderRolls();
      }
    }

    // ---------- Rolling ----------
    // Cube rotation that brings each face to the front
    const FACES = [
      { x: 0,   y: 0,   value: 1 },
      { x: 0,   y: 180, value: 6 },
      { x: 0,   y: 90,  value: 4 },
      { x: 0,   y: -90, value: 3 },
      { x: -90, y: 0,   value: 5 },
      { x: 90,  y: 0,   value: 2 }
    ];

    let rotX = 0, rotY = 0;
    let isRolling = false;
    const mod = (n, m) => ((n % m) + m) % m;

    function spawnParticles() {
      if (reducedMotion) return;
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 130 + 'px';
        p.style.top  = Math.random() * 130 + 'px';
        p.style.setProperty('--drift', `${(Math.random() - 0.5) * 100}px`);
        p.style.animationDelay = `${Math.random() * 0.3}s`;
        diceStage.appendChild(p);
        setTimeout(() => p.remove(), 2400);
      }
    }

    const wait = (ms) => new Promise(r => setTimeout(r, ms));

    async function roll() {
      if (isRolling) return;
      isRolling = true;
      diceContainer.setAttribute('aria-disabled', 'true');
      rollHint.style.opacity = '0';

      result.textContent = '';
      result.className = '';

      play('some');
      spawnParticles();

      // 1. Shake + toss
      cube.classList.add('shaking');
      diceContainer.classList.add('tossing');
      diceShadow.classList.add('tossing');
      await wait(300);
      cube.classList.remove('shaking');

      // 2. Tumble
      rotX += Math.random() * 360 + 360;
      rotY += Math.random() * 360 + 360;
      cube.style.transition = 'transform 0.5s linear';
      cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      await wait(450);

      // 3. Land on the chosen face
      const { x, y, value } = FACES[randInt(FACES.length)];
      rotX += 720 + mod(x - rotX, 360);
      rotY += 720 + mod(y - rotY, 360);
      cube.style.transition = 'transform 1s cubic-bezier(0.2, 0.8, 0.2, 1)';
      cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
      await wait(1000);

      // 4. Result
      play('body');
      result.textContent = `${plural(value)}!`;
      void result.offsetWidth; // restart the pop animation
      result.classList.add('pop');
      if (value === 6) result.classList.add('max');
      if (value === 1) result.classList.add('min');
      diceContainer.setAttribute('aria-label', `Rolled ${plural(value)}. Roll again`);

      saveRoll(value);

      diceContainer.classList.remove('tossing');
      diceShadow.classList.remove('tossing');
      diceContainer.removeAttribute('aria-disabled');
      isRolling = false;
    }

    diceContainer.addEventListener('click', roll);
    diceContainer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); roll(); }
    });
    // Space anywhere on the page (unless a control has focus) also rolls
    document.addEventListener('keydown', (e) => {
      if (e.key !== ' ' || e.repeat) return;
      const tag = (document.activeElement?.tagName || '').toLowerCase();
      if (['select', 'button', 'input', 'textarea'].includes(tag)) return;
      if (document.activeElement === diceContainer) return;
      e.preventDefault();
      roll();
    });

    updateUsername();
  })();
  </script>
</body>
</html>
