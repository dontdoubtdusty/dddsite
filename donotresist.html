<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARPORT SECURITY</title>
<link rel="icon" href="images/starport/W.svg">
<style>
    :root {
        --hazard: #f5c518;
        --ink: #0b0f1a;
        --glow: #7fffd4;
        --siren-red: rgba(255, 30, 60, 0.22);
        --siren-blue: rgba(40, 110, 255, 0.24);
        --art: min(320px, 72vw);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        color: #fff;
        font-family: "Courier New", Courier, monospace;
        background: #070b1c;
        display: flex;
        flex-direction: column;
    }

    /* ---------- static starfield on its own layer (painted once, never repainted) ---------- */
    .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: #070b1c;
        background-image:
            radial-gradient(1px 1px at 20px 30px, #fff 50%, transparent 51%),
            radial-gradient(1px 1px at 140px 80px, #cfe 50%, transparent 51%),
            radial-gradient(1.5px 1.5px at 90px 160px, #fff 50%, transparent 51%),
            radial-gradient(1px 1px at 210px 210px, #9cf 50%, transparent 51%),
            radial-gradient(1px 1px at 260px 40px, #fff 50%, transparent 51%),
            radial-gradient(ellipse at 50% 120%, #1d3a7a 0%, transparent 60%),
            linear-gradient(#070b1c, #0d1636);
        background-size: 293px 257px, 419px 373px, 171px 199px, 537px 461px, 233px 311px, 100% 100%, 100% 100%;
        transform: translateZ(0);
    }

    /* ---------- siren: red/blue swap in hard steps (2 repaints per cycle, not 60/s) ---------- */
    .siren, .flash {
        position: fixed;
        inset: 0;
        pointer-events: none;
    }
    .siren { z-index: 1; animation: siren 1.6s steps(1) infinite; }
    .siren.red  { background: radial-gradient(ellipse at 0% 0%, var(--siren-red), transparent 60%); }
    .siren.blue { background: radial-gradient(ellipse at 100% 0%, var(--siren-blue), transparent 60%); animation-delay: -0.8s; }
    @keyframes siren { 0% { opacity: 1; } 50% { opacity: 0.15; } }
    .flash { background: rgba(255, 0, 40, 0.35); opacity: 0; z-index: 50; }
    .flash.on { animation: flash 0.6s ease-out; }
    @keyframes flash { 0%, 40% { opacity: 1; } 100% { opacity: 0; } }

    /* ---------- layout ---------- */
    main {
        position: relative;
        z-index: 3;
        flex: 1;
        display: grid;
        gap: 16px;
        align-content: center;
        justify-items: center;
        padding: 20px 16px;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
    }

    .message {
        margin: 0;
        text-align: center;
        font: bold clamp(1rem, 3.6vw, 1.7rem)/1.3 Arial, sans-serif;
        letter-spacing: 0.15em;
        text-shadow: 0 0 10px var(--glow);
        min-height: 2.6em;
        max-width: 44ch;
    }
    .message .caret { display: inline-block; width: 0.6em; animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- art + button ---------- */
    .arena { position: relative; width: var(--art); height: var(--art); }
    .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 4px solid var(--hazard);
        box-shadow: 0 0 0 6px var(--ink), 0 0 30px rgba(127, 255, 212, 0.45);
        pointer-events: none;
    }
    .rotator {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        animation: spin 12s linear infinite;
        will-change: transform;
        transition: opacity 0.4s;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .arena.graveyard .rotator { opacity: 0.4; }

    .resist-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 38px;
        font: bold 1.6rem Arial, sans-serif;
        letter-spacing: 0.2em;
        background: linear-gradient(135deg, #ff0000, #ff6b6b);
        color: #fff;
        border: 3px solid #ff0000;
        border-radius: 8px;
        cursor: pointer;
        text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
        box-shadow: 0 0 24px rgba(255, 0, 0, 0.6);
        transition: transform 0.45s cubic-bezier(.5, -0.4, .4, 1.4);
        z-index: 4;
    }
    .resist-btn:hover:not(.tapped) { transform: translate(-50%, -50%) scale(1.05); }
    .resist-btn:focus-visible { outline: 3px solid var(--glow); outline-offset: 4px; }
    .resist-btn.tapped {
        transform: translate(-50%, -50%) rotate(90deg);
        background: #555;
        border-color: #777;
        color: #aaa;
        text-shadow: none;
        box-shadow: none;
        cursor: not-allowed;
    }
    .resist-btn.shake { animation: shake 0.35s; }
    @keyframes shake {
        25% { transform: translate(calc(-50% - 6px), -50%) rotate(90deg); }
        75% { transform: translate(calc(-50% + 6px), -50%) rotate(90deg); }
    }

    /* RESIST falls apart into bones */
    .resist-btn.dead { pointer-events: none; background: transparent; border-color: transparent; box-shadow: none; }
    .resist-btn.dead .bone { display: inline-block; animation: crumble 1s cubic-bezier(.4, 0, 1, 1) forwards; }
    @keyframes crumble {
        to { transform: translate(var(--dx), 220px) rotate(var(--rot)); opacity: 0; }
    }
    .resist-btn.rising { animation: rise 0.8s ease-out; }
    @keyframes rise { from { opacity: 0; } }
    .reassemble-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 22px;
        font: bold 1.15rem Arial, sans-serif;
        letter-spacing: 0.12em;
        background: linear-gradient(135deg, #1a1420, #3b2f45);
        color: #e9dcc0;
        border: 3px solid #8d7aa0;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 0 24px rgba(141, 122, 160, 0.7);
        z-index: 4;
        white-space: nowrap;
    }
    .reassemble-btn[hidden] { display: none; }
    .reassemble-btn:hover, .reassemble-btn:focus-visible { border-color: #e9dcc0; outline: none; }
    .reassemble-btn .ms { height: 1.15em; width: 1.15em; }
    .exhibits { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

    .phase {
        position: absolute;
        left: 50%;
        top: -14px;
        transform: translate(-50%, 0);
        background: var(--hazard);
        color: var(--ink);
        font: 900 0.8rem Arial, sans-serif;
        letter-spacing: 0.2em;
        padding: 4px 10px;
        border-radius: 3px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 5;
        white-space: nowrap;
    }
    .phase.on { opacity: 1; }

    .status {
        min-height: 3.4em;
        max-width: 34rem;
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #dff;
    }
    .status em { color: var(--hazard); font-style: normal; }
    .ms { height: 1.05em; width: 1.05em; vertical-align: -0.15em; margin: 0 1px; }
    .strike { text-decoration: line-through; opacity: 0.55; }

    .linkish {
        background: none;
        border: 1px dashed rgba(255, 255, 255, 0.4);
        color: #dff;
        font: inherit;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
    }
    .linkish:hover, .linkish:focus-visible { border-color: var(--hazard); color: var(--hazard); outline: none; }

    /* ---------- evidence overlay ---------- */
    .evidence {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        place-items: center;
        background: rgba(0, 0, 0, 0.8);
        perspective: 1200px;
        cursor: zoom-out;
        padding: 16px;
    }
    .evidence.open { display: grid; }
    .evidence figure { margin: 0; text-align: center; }
    .evidence img {
        width: min(400px, 86vw);
        max-height: 80dvh;
        object-fit: contain;
        border-radius: 4.5%;
        box-shadow: 0 0 40px rgba(127, 255, 212, 0.4);
        animation: flipin 0.7s cubic-bezier(.2, .8, .2, 1);
    }
    .evidence figcaption { margin-top: 10px; font-size: 0.85rem; letter-spacing: 0.15em; color: var(--hazard); }
    @keyframes flipin { from { transform: rotateY(180deg) scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }

    .mute {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 30;
        font: inherit;
        font-size: 0.75rem;
        background: rgba(0, 0, 0, 0.6);
        color: #dff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 5px 9px;
        cursor: pointer;
    }

    @media (prefers-reduced-motion: reduce) {
        .siren, .rotator, .caret, .evidence img, .resist-btn.rising, .resist-btn.dead .bone, .resist-btn.shake { animation: none !important; }
        .resist-btn { transition: none; }
    }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="siren red" aria-hidden="true"></div>
<div class="siren blue" aria-hidden="true"></div>
<div class="flash" aria-hidden="true"></div>

<main>
    <p class="message" id="msgTop" aria-label="You are a suspect in an ongoing investigation."></p>

    <div class="arena">
        <span class="phase" id="phase">UNTAP STEP</span>
        <img class="rotator" src="images/starport/art_crop.jpg" width="626" height="457"
             alt="Starport Security, a tall white security robot, standing over an apprehended suspect">
        <div class="ring" aria-hidden="true"></div>
        <button class="resist-btn" id="resist" type="button">RESIST</button>
        <button class="reassemble-btn" id="reassemble" type="button" hidden
                aria-label="Pay one and black mana: reassemble">
            <img class="ms" src="images/starport/1.svg" alt=""><img class="ms" src="images/starport/B.svg" alt="">: REASSEMBLE
        </button>
    </div>

    <div class="status" id="status" aria-live="polite">Officer on duty. Remain where you are.</div>

    <p class="message" id="msgBot" aria-label="Do not resist apprehension."></p>

    <div class="exhibits">
        <button class="linkish" id="exhibitA" type="button">EXHIBIT A</button>
        <button class="linkish" id="exhibitB" type="button">EXHIBIT B: KNOWN ASSOCIATE</button>
    </div>
</main>

<div class="evidence" id="evidence" role="dialog" aria-modal="true" aria-labelledby="evidenceCap">
    <figure>
        <img id="evidenceImg" src="images/starport/normal.jpg" width="488" height="680" alt="">
        <figcaption id="evidenceCap"></figcaption>
    </figure>
</div>

<button class="mute" id="mute" type="button">SOUND: ON</button>

<script>
(() => {
    const $ = id => document.getElementById(id);
    const btn = $('resist'), statusEl = $('status'), phaseEl = $('phase');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const sym = s => `<img class="ms" src="images/starport/${s}.svg" alt="{${s}}">`;

    let muted = false;
    try { muted = localStorage.getItem('starport-muted') === '1'; } catch (e) {}

    /* ---------- sound (WebAudio, created on first gesture) ---------- */
    let ctx;
    function tone(freq, start, dur, type = 'square', vol = 0.06, endFreq) {
        if (muted) return;
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + start;
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (endFreq) o.frequency.linearRampToValueAtTime(endFreq, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
    }
    const sfx = {
        tap:   () => { tone(880, 0, 0.09); tone(440, 0.11, 0.14); },
        deny:  () => { tone(160, 0, 0.25, 'sawtooth', 0.05); },
        untap: () => { tone(520, 0, 0.12, 'triangle', 0.08, 780); },
        crumble: () => { [0, 0.07, 0.15, 0.22, 0.31].forEach((s, i) => tone(300 - i * 40, s, 0.06, 'square', 0.05)); },
        siren: () => { [0, 0.45].forEach(s => { tone(620, s, 0.22, 'sawtooth', 0.04, 900); tone(900, s + 0.22, 0.22, 'sawtooth', 0.04, 620); }); },
    };

    /* ---------- typewriter (text node + one caret element, no innerHTML churn) ---------- */
    function typeOut(el, text, delay) {
        return new Promise(res => {
            if (reduced) { el.textContent = text; return res(); }
            const txt = document.createTextNode('');
            const caret = document.createElement('span');
            caret.className = 'caret';
            caret.setAttribute('aria-hidden', 'true');
            caret.textContent = '█';
            el.append(txt, caret);
            let i = 0;
            setTimeout(function step() {
                txt.data = text.slice(0, ++i);
                if (i < text.length) setTimeout(step, 38 + Math.random() * 40);
                else { setTimeout(() => caret.remove(), 900); res(); }
            }, delay);
        });
    }
    typeOut($('msgTop'), 'YOU ARE A SUSPECT IN AN ONGOING INVESTIGATION', 300)
        .then(() => typeOut($('msgBot'), 'DO NOT RESIST APPREHENSION', 400));

    /* ---------- tap / untap loop ---------- */
    let tapped = false, activations = 0, attempts = 0, untapTimer, upkeepTimer;

    function costHTML() {
        // First activation pays full price; after that we "control a creature with a +1/+1 counter".
        return activations === 0
            ? `${sym(3)}${sym('W')}, ${sym('T')}`
            : `<span class="strike">${sym(3)}</span>${sym(1)}${sym('W')}, ${sym('T')}`;
    }

    function setTapped() {
        tapped = true;
        tappedClicks = 0;
        btn.classList.add('tapped');
        btn.setAttribute('aria-label', 'Resist (tapped)');
        untapTimer = setTimeout(untap, 5000);
    }

    function tapIt(reason) {
        clearTimeout(upkeepTimer);
        const cost = costHTML();
        activations++;
        phaseEl.classList.remove('on');
        const discount = activations > 1
            ? `<br><em>This ability costs ${sym(2)} less: Starport Security controls a creature with a +1/+1 counter.</em>`
            : '';
        statusEl.innerHTML = `${reason}<br>${cost}: Tap another target creature. <em>RESIST is tapped.</em>${discount}`;
        sfx.tap();
        setTapped();
    }

    function untap() {
        tapped = false;
        btn.classList.remove('tapped');
        btn.removeAttribute('aria-label');
        phaseEl.textContent = 'UNTAP STEP';
        phaseEl.classList.add('on');
        statusEl.innerHTML = 'Your untap step. RESIST untaps. You feel a brief, foolish flicker of hope.';
        sfx.untap();
        upkeepTimer = setTimeout(() => {
            phaseEl.textContent = 'UPKEEP';
            tapIt('<em>During your upkeep</em>, Starport Security activates.');
        }, 2600);
    }

    /* ---------- graveyard + reassemble ---------- */
    const arena = document.querySelector('.arena'), reBtn = $('reassemble');
    let inGraveyard = false, tappedClicks = 0;

    function destroy() {
        clearTimeout(untapTimer); clearTimeout(upkeepTimer);
        inGraveyard = true;
        tapped = false;
        phaseEl.classList.remove('on');
        btn.innerHTML = [...'RESIST'].map(ch => {
            const dx = Math.round(Math.random() * 160 - 80), rot = Math.round(Math.random() * 540 - 270);
            return `<span class="bone" style="--dx:${dx}px;--rot:${rot}deg">${ch}</span>`;
        }).join('');
        btn.classList.add('dead');
        arena.classList.add('graveyard');
        statusEl.innerHTML = 'Excessive resistance. <em>RESIST was destroyed</em> and put into the graveyard.<br>It will be back. It is always back.';
        sfx.crumble();
        setTimeout(() => {
            btn.hidden = true;
            reBtn.hidden = false;
            reBtn.focus({ preventScroll: true });
        }, reduced ? 200 : 1000);
    }

    reBtn.addEventListener('click', () => {
        inGraveyard = false;
        reBtn.hidden = true;
        arena.classList.remove('graveyard');
        btn.textContent = 'RESIST';
        btn.classList.remove('dead');
        btn.hidden = false;
        btn.classList.add('rising');
        setTimeout(() => btn.classList.remove('rising'), 900);
        // Reassembling Skeleton returns to the battlefield TAPPED. We didn't even have to activate.
        statusEl.innerHTML = `${sym(1)}${sym('B')}: Return this card from your graveyard to the battlefield <em>tapped</em>.<br>Starport Security did not even have to activate.`;
        sfx.untap();
        sfx.tap();
        setTapped();
    });

    btn.addEventListener('click', () => {
        if (inGraveyard) return;
        attempts++;
        if (tapped) {
            if (++tappedClicks >= 3) { destroy(); return; }
            statusEl.innerHTML = 'RESIST is already tapped. <em>Tapped creatures can\'t resist.</em> This has been noted.';
            btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
            sfx.deny();
            return;
        }
        tapIt(`Resistance attempt #${attempts} detected. In response, Starport Security activates.`);
    });

    /* ---------- escape attempts ---------- */
    const flashEl = document.querySelector('.flash');
    function escapeAttempt() {
        flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
        sfx.siren();
    }
    document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if ($('evidence').classList.contains('open')) { closeEvidence(); return; }
        escapeAttempt();
        statusEl.innerHTML = '<em>ESCAPE ATTEMPT RECORDED.</em> There is no escape key in a starport.';
    });

    const baseTitle = document.title;
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            document.title = 'RETURN TO CUSTODY';
            hiddenAt = Date.now();
        } else {
            document.title = baseTitle;
            if (hiddenAt && Date.now() - hiddenAt > 1500) {
                escapeAttempt();
                statusEl.innerHTML = 'Welcome back. <em>We saw you leave.</em>';
            }
            hiddenAt = 0;
        }
    });

    /* ---------- exhibits ---------- */
    const ev = $('evidence');
    const EXHIBITS = {
        exhibitA: {
            src: 'images/starport/normal.jpg',
            cap: 'EXHIBIT A: THE ARRESTING OFFICER',
            alt: 'Starport Security card. 3 and white mana, tap: Tap another target creature. This ability costs 2 less to activate if you control a creature with a +1/+1 counter on it. Flavor text: You are a suspect in an ongoing investigation. Do not resist apprehension. 1/1.',
        },
        exhibitB: {
            src: 'images/starport/skeleton.jpg',
            cap: 'EXHIBIT B: KNOWN ASSOCIATE. PRIOR ARRESTS: TOO MANY',
            alt: 'Reassembling Skeleton card. 1 and black mana: Return this card from your graveyard to the battlefield tapped. 1/1.',
        },
    };
    let lastExhibit;
    function closeEvidence() { ev.classList.remove('open'); if (lastExhibit) lastExhibit.focus(); }
    Object.entries(EXHIBITS).forEach(([id, x]) => {
        $(id).addEventListener('click', e => {
            lastExhibit = e.currentTarget;
            const img = $('evidenceImg');
            img.src = x.src;
            img.alt = x.alt;
            $('evidenceCap').textContent = x.cap + ' (click anywhere to return to custody)';
            // restart the flip-in animation
            img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
            ev.classList.add('open');
        });
    });
    ev.addEventListener('click', closeEvidence);

    /* ---------- mute ---------- */
    const muteBtn = $('mute');
    const paintMute = () => { muteBtn.textContent = muted ? 'SOUND: OFF' : 'SOUND: ON'; muteBtn.setAttribute('aria-pressed', String(muted)); };
    muteBtn.addEventListener('click', () => {
        muted = !muted;
        try { localStorage.setItem('starport-muted', muted ? '1' : '0'); } catch (e) {}
        paintMute();
    });
    paintMute();

    // Clear the old rap sheet from earlier versions of this page.
    try { localStorage.removeItem('starport-rapsheet'); } catch (e) {}
})();
</script>
</body>
</html>
