<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The FHR Archives</title>
    <!-- Compiled Tailwind (rebuild command is in tools/fhr-tailwind.config.js). Replaces the cdn.tailwindcss.com dev build. -->
    <link rel="stylesheet" href="fhr/fhrquotes.css">
    <style>
        body {
            background-color: #f6c7b7;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #000000;
        }
        .parchment {
            background: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e5e5e5;
        }
        h1, h2, h3, .text-purple-900, .text-purple-700 {
            color: #000000 !important;
        }
        a { color: #0000EE !important; text-decoration: underline; }
        a:hover { color: #551A8B !important; text-decoration: none; }
        button {
            background-image: none !important;
            background-color: #333333 !important;
            color: #ffffff !important;
            border: 1px solid #000000;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #000000 !important;
            transform: none !important;
        }
        /* Custom style for the Read Review button */
        .read-review-btn {
            display: inline-block;
            background-color: #ffffff;
            color: #333333 !important;
            text-decoration: none !important;
            padding: 8px 20px;
            border: 1px solid #cccccc;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .read-review-btn:hover {
            background-color: #f5f5f5;
            border-color: #999999;
            color: #000000 !important;
            cursor: pointer;
        }
        /* specific styles for the Random Quote buttons */
        #randomBtn, #bottomBtn {
            /* 1. The Image with a Light Overlay (0.8 opacity white) */
            background-image: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), url('fhr/dark-full-house-fan-theories.jpg') !important;

            /* 2. Center and cover the button */
            background-position: center !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;

            /* 3. Text Color (Black text looks best on a light overlay) */
            color: #000000 !important;

            /* 4. Border to make it look sharp */
            border: 2px solid #000000 !important;
        }

        /* Optional: Change the overlay slightly on hover for effect */
        #randomBtn:hover, #bottomBtn:hover {
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('fhr/dark-full-house-fan-theories.jpg') !important;
            color: #000000 !important;
        }
        #quoteOfDayBox {
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body class="p-6">
<header>
  <img src="fhr/fhrbanner.jpg" alt="FHR Archives Banner" style="width: 100%; max-width: 450px; height: auto; display: block; margin: 0 auto;">
</header>

<!-- This Week in FHR History (hidden until a review has loaded) -->
<div id="quoteOfDayBox" class="parchment rounded-lg p-6 mb-6 shadow-lg border border-gray-300" style="display: none;">
    <h2 id="quoteOfDayHeading" class="text-lg font-bold text-black mb-3">
        This Week in FHR History
    </h2>
    <div id="quoteOfDayContent" class="flex flex-col gap-4 text-center"></div>
    <div class="mt-4 pt-3 border-t border-gray-200 flex justify-between items-end">
        <p class="text-sm text-gray-600" id="quoteOfDayInfo"></p>
        <a id="quoteOfDayLink" href="#" class="read-review-btn">Read Review</a>
    </div>
</div>

    <div class="max-w-4xl mx-auto" style="max-width: 700px; padding: 60px 24px;">
        <h1 class="text-4xl font-bold mb-2 text-center tracking-wide drop-shadow-md relative block mx-auto pb-3" style="letter-spacing: 0.05em;">
            <span class="px-4 py-1" style="border-color: #000000;">THE FHR ARCHIVES</span>
        </h1>
        <div class="flex justify-center mt-2 mb-6">
            <div class="h-1 w-24 bg-black rounded-full opacity-70"></div>
        </div>

        <p class="text-center mb-2 font-bold" id="quoteCount">Loading Archives...</p>
        <p class="text-center mb-8 text-sm italic text-gray-600" id="subStatus">Fetching scrolls...</p>

        <div class="parchment rounded-lg p-6 mb-6 shadow-lg">
            <button
                id="randomBtn"
                disabled
                class="w-full flex items-center justify-center gap-2 py-4 rounded-lg transition-all transform hover:scale-105 shadow-md opacity-50 cursor-not-allowed"
            >
                <span>Loading...</span>
            </button>
        </div>

        <div id="randomQuoteDisplay" class="hidden parchment rounded-lg p-6 mb-6 shadow-lg border border-gray-300">
            <div id="randomContentArea" class="flex flex-col gap-6 text-center"></div>

            <div id="firstsContainer" class="hidden">
                <hr class="border-t border-gray-100 my-4"> <p id="randomFirstsInfo" class="text-center text-sm text-gray-500 italic"></p>
            </div>

            <div class="mt-6 pt-4 border-t border-gray-200 flex justify-between items-end">
                <p class="text-sm text-gray-600" id="randomQuoteInfo"></p>
                <a id="randomLink" href="#" class="read-review-btn">Read Review</a>
            </div>
        </div>

        <div id="bottom-button-container" style="display: none; margin-top: 20px;">
            <button
                id="bottomBtn"
                onclick="generateQuote()"
                class="w-full flex items-center justify-center gap-2 py-4 rounded-lg transition-all transform hover:scale-105 shadow-md"
            >
                <span>Get Another Quote</span>
            </button>
        </div>

    </div>

<script>
// --- 1. SHARED STATE AND HELPERS ---
const catchphrases = [
    "Cut. It. Out!", "Have Mercy!", "How Rude!", "You Got It, Dude!",
    "Oh, My Lanta!", "Hola, Tanneritos!", "Watch The Hair!",
    "Pin a Rose on Your Nose!", "Clean is Good, Dirt is Bad."
];
const REVIEW_SITE = 'https://therealfullhousereviewed.wordpress.com/';
const IMG_CLASS = "max-w-full h-auto mx-auto border border-gray-300 shadow-sm";

let reviews = [];          // every entry from fhr/index.json
let usable = [];           // entries that contain at least one image/text/image block
let nextReview = null;     // review already being prefetched for the next click
const docCache = new Map();

const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const randomCatchphrase = () => pick(catchphrases);

// Fetch and parse a review once; later calls reuse the result.
function fetchReviewDoc(filename) {
    if (!docCache.has(filename)) {
        const p = fetch(`fhr/${filename}`)
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
            .then(t => new DOMParser().parseFromString(t, 'text/html'));
        p.catch(() => docCache.delete(filename));
        docCache.set(filename, p);
    }
    return docCache.get(filename);
}

// Every "image, text paragraphs, image(s)" sandwich in a review.
// NOTE: keep in sync with countBlocks() in tools/fhr-build-index.js.
function findBlocks(doc) {
    const nodes = Array.from(doc.querySelectorAll('p')).map(p => {
        if (p.querySelector('img')) return { type: 'IMG', el: p };
        const text = p.textContent.trim();
        if (text && !text.includes('Original Date')
                 && !text.toLowerCase().includes('source:')
                 && !text.startsWith('Firsts:')) {
            return { type: 'TEXT', el: p };
        }
        return { type: 'SKIP' };
    });

    const blocks = [];
    for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].type !== 'IMG') continue;
        const texts = [];
        for (let j = i + 1; j < nodes.length; j++) {
            if (nodes[j].type === 'TEXT') {
                texts.push(nodes[j].el);
            } else if (nodes[j].type === 'IMG') {
                if (texts.length > 0) {
                    const endImages = [nodes[j].el];
                    // Gather consecutive image paragraphs. One that also has text starts a new segment.
                    for (let k = j + 1; k < nodes.length && nodes[k].type === 'IMG'; k++) {
                        if (nodes[k].el.textContent.trim().length > 0) break;
                        endImages.push(nodes[k].el);
                    }
                    blocks.push({ start: nodes[i].el, texts, endImages });
                }
                break;
            }
        }
    }
    return blocks;
}

function renderBlock(container, block, maxTexts) {
    const img = block.start.querySelector('img').cloneNode(true);
    img.className = IMG_CLASS;
    container.appendChild(img);

    const textDiv = document.createElement('div');
    textDiv.className = "text-black px-2";
    textDiv.style.fontFamily = "Georgia, 'Bitstream Charter', serif";
    textDiv.style.fontSize = '16px';
    textDiv.style.lineHeight = '1.5';
    block.texts.slice(0, maxTexts).forEach(p => {
        const clone = p.cloneNode(true);
        clone.className = "mb-4";
        textDiv.appendChild(clone);
    });
    container.appendChild(textDiv);

    block.endImages.forEach(pTag => {
        const imgClone = pTag.querySelector('img').cloneNode(true);
        imgClone.className = IMG_CLASS;
        container.appendChild(imgClone);
    });
}

function reviewUrl(r) {
    const slug = r.t.toLowerCase()
        .replace(/['"“”‘’]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    return r.d ? `${REVIEW_SITE}${r.d.replace(/-/g, '/')}/${slug}/` : REVIEW_SITE;
}

// Start downloading the review the next click will show.
function prefetchNext() {
    nextReview = pick(usable);
    fetchReviewDoc(nextReview.f).catch(() => {});
}

// --- 2. LOAD THE ARCHIVE INDEX ---
async function loadFhrArchive() {
    try {
        const response = await fetch('fhr/index.json');
        if (!response.ok) throw new Error("Could not find fhr/index.json");
        reviews = await response.json();
        usable = reviews.filter(r => r.b > 0);
        window.quotes = reviews;

        document.getElementById('subStatus').textContent = `A permanent tribute to Billy Superstar. No new reviews will be found; he has finally escaped.`;
        initApp();
    } catch (error) {
        document.getElementById('quoteCount').textContent = "Error Loading Archive";
        document.getElementById('subStatus').textContent = "Make sure fhr/index.json exists (run node tools/fhr-build-index.js).";
        console.error(error);
    }
}

// --- 3. INITIALIZE BUTTONS ---
function initApp() {
    document.getElementById('quoteCount').textContent = `A complete codex of ${reviews.length} reviews.`;

    const topBtn = document.getElementById('randomBtn');
    topBtn.disabled = false;
    topBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    topBtn.querySelector('span').textContent = `◉ ${randomCatchphrase()}`;
    topBtn.onclick = generateQuote;

    displayQuoteOfTheDay();
    prefetchNext();
}

// --- 4. RANDOM QUOTE ---
async function generateQuote() {
    const displayBox = document.getElementById('randomQuoteDisplay');
    const contentArea = document.getElementById('randomContentArea');
    const infoBox = document.getElementById('randomQuoteInfo');
    const linkBox = document.getElementById('randomLink');
    const firstsContainer = document.getElementById('firstsContainer');
    const firstsBox = document.getElementById('randomFirstsInfo');

    // Reset UI
    displayBox.classList.remove('hidden');
    firstsContainer.classList.add('hidden');
    contentArea.innerHTML = '<p class="italic text-gray-500 py-8">Scanning archives...</p>';
    infoBox.textContent = "";
    firstsBox.textContent = "";

    const newPhrase = randomCatchphrase();
    document.getElementById('randomBtn').innerHTML = `<span>◉ ${newPhrase}</span>`;
    const bottomBtn = document.getElementById('bottomBtn');
    if (bottomBtn) bottomBtn.innerHTML = `<span>◉ ${newPhrase}</span>`;

    try {
        // The index already says which reviews have a usable block, so this almost never retries.
        let review = null, block = null;
        for (let attempt = 0; attempt < 5 && !block; attempt++) {
            review = nextReview || pick(usable);
            nextReview = null;
            const blocks = findBlocks(await fetchReviewDoc(review.f));
            if (blocks.length) block = pick(blocks);
        }

        contentArea.innerHTML = '';
        if (block) {
            renderBlock(contentArea, block, Infinity);
        } else {
            contentArea.innerHTML = `<p class="text-lg">Unable to conjure a visual memory.</p>`;
        }

        infoBox.innerHTML = '';
        infoBox.append(review.t);
        if (review.d) { infoBox.append(document.createElement('br'), `Review Date: ${review.d}`); }
        linkBox.href = reviewUrl(review);

        if (review.s) {
            firstsContainer.classList.remove('hidden');
            firstsBox.textContent = `Firsts in this episode: ${review.s}`;
        }
    } catch (e) {
        console.error(e);
        contentArea.innerHTML = '<p class="text-red-600">The archives are dusty. Please try again.</p>';
    }

    document.getElementById("bottom-button-container").style.display = "block";
    prefetchNext();
}

// --- 5. THIS WEEK IN FHR HISTORY ---
// Uses only the index to choose a review, then downloads that one file.
function chooseHistoryReview(today) {
    // Reviews whose month/day falls on today or one of the previous 6 days.
    for (let daysBack = 0; daysBack < 7; daysBack++) {
        const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - daysBack);
        const suffix = `-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const matches = reviews.filter(r => r.b > 0 && r.d && r.d.endsWith(suffix));
        if (matches.length) return { review: pick(matches), exact: true };
    }

    // Nothing this week: fall back to the closest anniversary (in either direction).
    const DAY = 86400000, YEAR = 366 * DAY;
    const todayKey = Date.UTC(2000, today.getMonth(), today.getDate());
    let best = [], bestDist = Infinity;
    for (const r of reviews) {
        if (r.b === 0 || !r.d) continue;
        const [, m, d] = r.d.split('-').map(Number);
        let dist = Math.abs(Date.UTC(2000, m - 1, d) - todayKey);
        dist = Math.min(dist, YEAR - dist);
        if (dist < bestDist) { bestDist = dist; best = [r]; }
        else if (dist === bestDist) best.push(r);
    }
    return best.length ? { review: pick(best), exact: false } : null;
}

async function displayQuoteOfTheDay() {
    const box = document.getElementById('quoteOfDayBox');
    try {
        const choice = chooseHistoryReview(new Date());
        if (!choice) return;
        const { review, exact } = choice;

        const block = findBlocks(await fetchReviewDoc(review.f))[0];
        if (!block) return;

        const contentArea = document.getElementById('quoteOfDayContent');
        renderBlock(contentArea, block, 1);

        if (!exact) {
            document.getElementById('quoteOfDayHeading').textContent = 'From the FHR Archives';
        }
        document.getElementById('quoteOfDayInfo').textContent = review.t + (review.d ? ` • ${review.d}` : "");
        document.getElementById('quoteOfDayLink').href = reviewUrl(review);
        box.style.display = '';
    } catch (e) {
        console.error('This Week in FHR History failed:', e);
    }
}

loadFhrArchive();
</script>
</body>
</html>
