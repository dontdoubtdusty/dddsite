<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Don't Doubt Dusty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #ffffff;
    --red-tint: #f9eaea;
    --paper: #012161;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 32px 100px;
    background: var(--paper);
    color: var(--red);
    font-family: "Pixelify Sans", "Courier New", monospace;
  }
  h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px 40px;
  }
  .tile {
    display: block;
    color: inherit;
    text-decoration: none;
    text-align: center;
  }
  .tile.big   { grid-column: span 3; }
  .tile.small { grid-column: span 2; }
  .label {
    display: block;
    margin-bottom: 4px;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    font-weight: 600;
  }
  .box {
    border: 3px solid var(--red);
    background: var(--paper);
    overflow: hidden;
    transition: background-color 0.15s;
  }
  .big .box   { aspect-ratio: 2 / 1; }
  .small .box { aspect-ratio: 16 / 10; }
  .box img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile:hover .box { background: var(--red-tint); }
  .tile:focus-visible { outline: none; }
  .tile:focus-visible .box {
    outline: 3px dashed var(--red);
    outline-offset: 4px;
  }
  /* Cardinal patrol */
  .cardinal {
    position: fixed;
    left: 0;
    bottom: 25px;
    height: 64px;            /* change to resize the cardinal */
    width: auto;
    z-index: 2;
    image-rendering: pixelated;
    pointer-events: none;    /* never blocks clicks on the page */
    will-change: transform;
  }
  .cardinal[hidden] { display: none; }
  @media (max-width: 720px) {
    body { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .tile.big, .tile.small { grid-column: auto; }
  }
  .logo {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);   /* centers it horizontally */
    height: 64px;                  /* adjust to your logo's size */
    width: auto;
    z-index: 1;
    pointer-events: none;          /* optional: lets clicks pass through */
  }
</style>
</head>
<body>
  <h1>Don't Doubt Dusty</h1>

  <main class="grid">
    <!-- Replace each href and img src with your own. -->

    <a class="tile big" href="https://open.spotify.com/artist/2ZGyFnBKOQq7kMWWjX688f" target="_blank" rel="noopener">
      <span class="label">Music</span>
      <div class="box">
        <img src="images/music.png" alt="Dusty's music on Spotify" onerror="this.style.display='none'">
      </div>
    </a>

    <a class="tile big" href="https://bigjuicydoug.itch.io/scoundrel" target="_blank" rel="noopener">
      <span class="label">Game</span>
      <div class="box">
        <img src="images/game.png" alt="Screenshot of the game" onerror="this.style.display='none'">
      </div>
    </a>

    <a class="tile small" href="8ball.html">
      <span class="label">8-Ball</span>
      <div class="box">
        <img src="images/8-ball.png" alt="The 8-Ball page" onerror="this.style.display='none'">
      </div>
    </a>

    <a class="tile small" href="thebookofcarp.html">
      <span class="label">The Book Of Carp</span>
      <div class="box">
        <img src="images/book-of-carp.png" alt="The Book Of Carp" onerror="this.style.display='none'">
      </div>
    </a>

    <a class="tile small" href="https://www.youtube.com/@DontDoubtDusty" target="_blank" rel="noopener">
      <span class="label">YouTube</span>
      <div class="box">
        <img src="images/youtube.png" alt="Dusty's YouTube channel" onerror="this.style.display='none'">
      </div>
    </a>
  </main>

  <img class="cardinal" id="cardinal" src="images/cardinal-1.png" alt="" aria-hidden="true">
  <img class="logo" src="images/dddlogo.png" alt="Don't Doubt Dusty logo">

  <script>
    (function () {
      var bird = document.getElementById('cardinal');
      var frames = ['images/cardinal-1.png', 'images/cardinal-2.png'];
      var SPEED = 60;        // pixels per second
      var FRAME_MS = 240;    // time each frame is shown

      // Hide the bird if the first frame is missing.
      bird.onerror = function () { bird.hidden = true; };

      // Respect "reduce motion": show a still bird instead of patrolling.
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var x = 0, dir = 1, frame = 0, last = null;

      setInterval(function () {
        frame = (frame + 1) % frames.length;
        bird.src = frames[frame];
      }, FRAME_MS);

      function step(t) {
        if (last === null) last = t;
        var dt = (t - last) / 1000;
        last = t;

        var max = Math.min(800, window.innerWidth - bird.offsetWidth);
        var offset = (window.innerWidth - bird.offsetWidth - max) / 2;
        x += dir * SPEED * dt;
        if (x >= max) { x = max; dir = -1; }
        if (x <= 0)   { x = 0;   dir = 1; }

        // Frames are assumed to face right; flip when walking left.
        bird.style.transform = 'translateX(' + (offset + x) + 'px) scaleX(' + dir + ')';
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
