<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://cards.scryfall.io" crossorigin>
    <link rel="preconnect" href="https://svgs.scryfall.io" crossorigin>
    <title>MTG Draft Advent Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, serif;
            background-color: #0f1626;
            background-image:
                linear-gradient(180deg, rgba(26,42,78,0.6) 0%, rgba(15,22,38,0.7) 50%, rgba(45,27,78,0.6) 100%),
                url('mtgadvent-bg.jpg?v=2');
            background-size: cover, contain;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Snow: a fixed set of flakes animated with transforms only */
        #snow { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
        .snowflake {
            position: absolute;
            top: -12px;
            border-radius: 50%;
            background: #fff;
        }

        main {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        .testbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #5a3d00;
            border: 1px solid #ffd700;
            color: #ffe9a8;
            font-size: 0.85em;
        }
        .testbar[hidden] { display: none; }
        .testbar button {
            font: inherit;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #ffd700;
            background: rgba(0,0,0,0.3);
            color: #ffe9a8;
            cursor: pointer;
        }
        .testbar button:hover { background: rgba(0,0,0,0.5); }
        .testbar a { color: #ffe9a8; }

        header { text-align: center; margin: 20px 0 24px; }
        h1 {
            font-size: 2.4em;
            color: #a8d5ff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }
        .subtitle {
            margin-top: 8px;
            font-size: 1.1em;
            font-style: italic;
            color: #7fc7ff;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }
        .status {
            margin-top: 14px;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(10,22,40,0.65);
            border: 1px solid rgba(127,199,255,0.3);
            color: #d6ebff;
            font-size: 0.95em;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }
        .calendar-grid[hidden] { display: none; }

        /* ---- Doors ---- */
        .door {
            --h: var(--hue, 352);
            position: relative;
            aspect-ratio: 1;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            font: inherit;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }
        .door:focus-visible { outline: 3px solid #ffd700; outline-offset: 4px; border-radius: 8px; }

        .frame {
            position: absolute;
            inset: 0;
            border-radius: 8px;
            perspective: 1600px; /* long perspective keeps swung-open leaves inside the grid gap */
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            background: #0a1220;
        }

        .leaf {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 2;
            background: linear-gradient(145deg, hsl(var(--h) 55% 40%), hsl(var(--h) 62% 24%));
            border: 1px solid hsl(var(--h) 70% 62% / 0.55);
            transition: transform 0.7s cubic-bezier(.3,.7,.2,1);
        }
        .leaf::before { /* recessed panel */
            content: '';
            position: absolute;
            inset: 12% 14%;
            border: 1px solid hsl(var(--h) 65% 62% / 0.45);
            border-radius: 3px;
        }
        .leaf::after { /* knob */
            content: '';
            position: absolute;
            top: 66%; /* below the day number */
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff3b0, #d4a017);
            box-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .leaf-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            margin: -14px 0 0 -14px;
            filter: invert(1);
            opacity: 0.85;
        }
        .leaf-l { left: 0; transform-origin: left center; border-radius: 8px 0 0 8px; }
        .leaf-r { right: 0; transform-origin: right center; border-radius: 0 8px 8px 0; }
        .leaf-l::after { right: 6%; }
        .leaf-r::after { left: 6%; }
        .door.open .leaf-l { transform: rotateY(-84deg); }
        .door.open .leaf-r { transform: rotateY(84deg); }

        .num {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6em;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .door.open .num { opacity: 0; }

        .lock {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 9%;
            width: 18px;
            height: 18px;
            margin-left: -9px;
            color: rgba(255,255,255,0.75);
        }

        /* Locked: dim, no hover */
        .door.state-locked, .door.state-next { cursor: not-allowed; }
        .door.state-locked .frame, .door.state-next .frame { opacity: 0.6; }
        .door.state-locked .num, .door.state-next .num { opacity: 0.8; }

        .icons img { width: 24px; height: 24px; filter: invert(1); }
        .when {
            position: absolute;
            z-index: 3;
            left: 0;
            right: 0;
            bottom: 20%;
            text-align: center;
            font-size: 0.72em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #d6ebff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Today: ready to open */
        .door.state-today:not(.open) .frame { box-shadow: 0 0 0 3px #ffd700; }

        /* What's behind the doors */
        .inside {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px 6px 7px;
            border-radius: 8px;
            overflow: hidden;
            background: #0b1426;
        }
        .inside::after { /* darken for legibility */
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5,10,22,0.35) 0%, rgba(5,10,22,0.1) 40%, rgba(5,10,22,0.85) 100%);
        }
        .art { position: absolute; inset: 0; }
        .art-piece { position: absolute; inset: 0; background-size: cover; background-position: center; }
        .art-piece.a { clip-path: polygon(0 0, 100% 0, 0 100%); }
        .art-piece.b { clip-path: polygon(100% 0, 100% 100%, 0 100%); }
        .icons { position: relative; z-index: 1; display: flex; gap: 6px; }
        .door-title {
            position: relative;
            z-index: 1;
            font-size: 0.8em;
            font-weight: bold;
            line-height: 1.15;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 1px 4px rgba(0,0,0,0.95);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .check {
            position: absolute;
            z-index: 4;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            padding: 3px;
            border-radius: 50%;
            background: #ffd700;
            color: #1a2845;
            box-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        .spark {
            position: fixed;
            z-index: 100;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff7c2, #ffd700);
            pointer-events: none;
        }

        /* ---- Details dialog ---- */
        .modal {
            margin: auto;
            width: min(600px, calc(100vw - 24px));
            max-height: calc(100vh - 24px);
            overflow: auto;
            padding: 0;
            color: #fff;
            background: linear-gradient(160deg, #0a1628, #1a2845);
            border: 2px solid #4a90e2;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .modal::backdrop { background: rgba(4,8,18,0.78); }
        .modal-inner { position: relative; padding: 24px 20px 20px; }
        #modalClose {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            padding: 8px;
            border: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            color: #a8d5ff;
            cursor: pointer;
        }
        #modalClose:hover { background: rgba(255,255,255,0.2); }
        #modalClose svg { width: 100%; height: 100%; }
        .modal-day { font-size: 0.8em; letter-spacing: 0.12em; text-transform: uppercase; color: #7fc7ff; text-align: center; }
        .modal-title { margin: 4px 36px 8px; text-align: center; font-size: 1.7em; color: #ffd700; line-height: 1.2; }
        .modal-desc { text-align: center; font-style: italic; color: #cfe6ff; margin-bottom: 18px; }
        .modal-sets { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
        .set-card { border: 1px solid rgba(127,199,255,0.3); border-radius: 10px; overflow: hidden; background: rgba(5,12,28,0.6); }
        .set-art { height: 110px; background-size: cover; background-position: center; }
        .set-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; }
        .set-head img { width: 24px; height: 24px; filter: invert(1); flex: none; }
        .set-name { font-weight: bold; color: #a8d5ff; }
        .set-blurb { padding: 6px 12px 0; font-size: 0.92em; line-height: 1.4; color: #d6ebff; }
        .set-credit { padding: 6px 12px 10px; font-size: 0.7em; color: #7f93ad; }

        footer { margin-top: 36px; text-align: center; font-size: 0.75em; color: rgba(214,235,255,0.6); line-height: 1.5; }

        @media (max-width: 820px) {
            h1 { font-size: 1.8em; }
            .calendar-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
            .num { font-size: 2.1em; }
        }
        @media (max-width: 600px) {
            .calendar-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .num { font-size: 1.9em; }
            .door-title { display: none; }
            .inside { justify-content: center; }
            .icons img { width: 26px; height: 26px; }
            .when { font-size: 0.62em; bottom: 21%; }
            .modal-title { font-size: 1.4em; }
        }

        @media (prefers-reduced-motion: reduce) {
            .leaf { transition-duration: 0.01s; }
        }
    </style>
</head>
<body>
    <div id="snow" aria-hidden="true"></div>
    <main>
        <div class="testbar" id="testbar" hidden>
            <span id="testLabel"></span>
            <button type="button" id="testPrev">&larr; Day</button>
            <button type="button" id="testNext">Day &rarr;</button>
            <button type="button" id="testReset">Close all doors</button>
            <a id="testExit" href="mtgadvent.html">Exit test mode</a>
        </div>
        <header>
            <h1>MTG Draft Advent Calendar <span id="year"></span></h1>
            <p class="subtitle">25 draft environments, built only from sets legal in Standard this Christmas</p>
            <p class="status" id="status" role="status">Loading...</p>
        </header>

        <div class="calendar-grid" id="calendar"></div>

        <footer>
            Set symbols and card art from <a href="https://scryfall.com" style="color:inherit">Scryfall</a>.
            Magic: The Gathering is &copy; Wizards of the Coast. Card art belongs to its artists.
        </footer>
    </main>

    <dialog class="modal" id="modal" aria-labelledby="modalTitle">
        <div class="modal-inner">
            <button type="button" id="modalClose" aria-label="Close"></button>
            <div id="modalBody"></div>
        </div>
    </dialog>

    <script src="draftsets.js?v=h3"></script>
    <script src="mtgadvent.js?v=4"></script>
</body>
</html>
